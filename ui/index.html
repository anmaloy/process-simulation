<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0f17'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%2334d3e0'/%3E%3C/svg%3E" />
<title>Process Simulation</title>
<style>
/* Palette — verbatim from STYLE_GUIDE.md §2. Do not introduce new hues. */
:root{
  --bg:#0b0f17; --bg-2:#10151f; --panel:#141b27; --panel-2:#1a2331;
  --line:#26303f; --line-2:#33425a;
  --ink:#e8edf5; --ink-dim:#9aa7ba; --ink-faint:#5f6e85;
  --spine:#34d3e0; --spine-glow:rgba(52,211,224,.35);
  --s-not:#566072; --s-learn:#e3b53e; --s-ref:#2f9e6b; --s-indep:#3d6fd6;
  --s-expert:#8b5cf6; --s-teach:#d9e0ec; --s-bad:#e5565b;
  --f-not:#1c2433; --f-learn:#5e4a16; --f-ref:#16513a; --f-indep:#1d3a78;
  --f-expert:#3a2a6b; --f-teach:#6c7585; --f-bad:#5a1e21;
  --subedge:#d9a93a;
  --radius:10px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-weight:400;font-display:swap;src:url('fonts/space-grotesk-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-weight:500;font-display:swap;src:url('fonts/space-grotesk-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-weight:600;font-display:swap;src:url('fonts/space-grotesk-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url('fonts/space-grotesk-latin-700-normal.woff2') format('woff2');}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:14px;overflow:hidden}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--spine)}
.eyebrow.quiet{color:var(--ink-faint)}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---- shell: rail | stage | inspector ---- */
.shell{display:grid;grid-template-columns:300px 1fr;height:100vh}
.shell.has-inspector{grid-template-columns:300px 1fr clamp(320px,22vw,520px)}

.rail{background:linear-gradient(180deg,var(--bg-2),var(--bg));border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand h1{margin:2px 0 0;font-size:18px;font-weight:600}
.brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);margin-top:6px}
.rail-scroll{overflow-y:auto;padding:12px 14px 40px;flex:1;min-height:0}
.rail-head{display:flex;gap:8px;margin-bottom:8px}

.tool-btn{background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-dim);border-radius:8px;padding:6px 10px;font-size:12px}
.tool-btn:hover:not(:disabled){border-color:var(--spine);color:var(--ink)}
.tool-btn:disabled{opacity:.4;cursor:default}

.rail-section{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.rail-section-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rail-section-toggle{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;width:100%;text-align:left}
.rail-caret{display:inline-block;transition:transform .12s;color:var(--ink-faint);font-size:9px}
.rail-caret.open{transform:rotate(90deg)}
.rail-count{margin-left:auto;color:var(--ink-faint);font-size:11px}
.rail-add{background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-dim);width:22px;height:22px;border-radius:6px;font-size:14px;line-height:1}
.rail-add:hover{border-color:var(--spine);color:var(--ink)}
.rail-search{position:relative;margin:8px 0}
.rail-more{color:var(--ink-faint);font-size:11px;font-style:italic;padding:4px 0}

.leaf{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--ink-dim)}
.leaf.clickable{cursor:pointer}
.leaf.clickable:hover{background:var(--panel)}
.leaf.selected{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--spine-glow);color:var(--ink)}
.leaf .dot{width:8px;height:8px;border-radius:50%;flex:none}
.leaf>span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaf .leaf-id{font-family:var(--mono);font-size:10px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.leaf.draggable{cursor:grab}

/* ---- inputs ---- */
.field-input,select.field-input{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12.5px}
.field-input:focus{outline:none;border-color:var(--spine)}
select.field-input{cursor:pointer}

/* ---- stage ---- */
.stage{position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px;
}
.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.canvas.dragging{cursor:grabbing}
/* No persistent will-change: it pins a single cached raster that gets GPU-upscaled
   after a zoom-in (fit), showing blurry until a later repaint. Rasterizing per
   on-screen scale keeps cards sharp; the node count is small so paint cost is low. */
#viewport{position:absolute;left:0;top:0;transform-origin:0 0}
#edges,#edges-hit{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
/* #edges (visible) sits behind the nodes; #edges-hit is a transparent layer
   above them so a pipe stroke stays clickable even where it passes a node,
   while gaps pass clicks through (pointer-events only on the strokes). */
#edges-hit path{pointer-events:stroke}

/* machine node */
.node{position:absolute;width:210px;background:var(--panel);border:1px solid var(--line-2);
  border-radius:10px;box-shadow:0 14px 34px -22px #000;user-select:none}
.node.selected{border-color:var(--spine);box-shadow:0 0 0 1px var(--spine),0 0 22px -4px var(--spine-glow)}
.node .nbar{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--s-not)}
.node .nhead{padding:8px 10px 6px 14px;cursor:grab}
.node.dragging .nhead{cursor:grabbing}
.node .ntitle{font-weight:600;font-size:12.5px;line-height:1.15;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nid{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nmeta{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 4px 14px;align-items:center}
.node .chip{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:5px;background:var(--panel-2);color:var(--ink-dim)}
.node .chip.status{font-weight:600}
.node .nstore{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);padding:0 10px 2px 14px}
.node .nports{position:relative;padding:4px 0 8px}
.port{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);
  transform:translate(-50%,-50%);cursor:crosshair;z-index:2}
.port:hover{box-shadow:0 0 0 3px var(--spine-glow)}
.port.in{left:0}.port.out{left:210px}
.plabel{position:absolute;font-family:var(--mono);font-size:9px;color:var(--ink-faint);transform:translateY(-50%);pointer-events:none}
.plabel.in{left:14px}.plabel.out{right:14px;text-align:right}

/* collapsed system node */
.sys{position:absolute;width:190px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px dashed var(--s-expert);border-radius:12px;box-shadow:0 14px 34px -22px #000;user-select:none}
.sys.selected{border-style:solid;border-color:var(--spine);box-shadow:0 0 0 1px var(--spine),0 0 22px -4px var(--spine-glow)}
.sys .nhead{padding:9px 12px;cursor:grab;display:flex;align-items:center;gap:8px}
.sys .sicon{color:var(--s-expert)}
.sys .smeta{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);padding:0 12px 10px}

/* pipe junction — a transparent routing dot (drag body to move, pull nub to wire) */
.junction{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--panel-2);
  border:2px solid var(--line-2);transform:translate(-50%,-50%);cursor:grab;z-index:3;user-select:none}
.junction.dragging{cursor:grabbing}
.junction.selected{border-color:var(--spine);box-shadow:0 0 0 2px var(--spine-glow)}
.junction .jdot{position:absolute;inset:3px;border-radius:50%}
.junction .jnub{position:absolute;right:-9px;top:50%;width:9px;height:9px;border-radius:50%;
  transform:translateY(-50%);border:2px solid var(--bg);cursor:crosshair;z-index:4}
.junction .jnub:hover{box-shadow:0 0 0 3px var(--spine-glow)}
.sys .expand{margin-left:auto;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;font-size:10px;padding:2px 6px;color:var(--ink-dim)}

/* floating overlays on the stage */
.palette{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;
  gap:8px;align-items:center;flex-wrap:wrap;max-width:min(66%,560px);padding:9px 12px;
  background:rgba(16,21,31,.92);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 50px -20px #000;backdrop-filter:blur(12px)}
.legend{position:absolute;top:14px;right:14px;z-index:6;display:flex;flex-direction:column;gap:8px;
  padding:9px 11px;background:rgba(16,21,31,.9);border:1px solid var(--line-2);border-radius:10px;backdrop-filter:blur(10px)}
.legend .row{display:flex;gap:10px;flex-wrap:wrap}
.legend .key{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink-dim)}
.legend-dot{width:9px;height:9px;border-radius:50%}
.controls{position:absolute;left:14px;bottom:14px;z-index:6;display:flex;flex-direction:column;gap:6px}
.controls button{width:30px;height:30px;background:rgba(16,21,31,.92);border:1px solid var(--line-2);border-radius:8px;color:var(--ink-dim);font-size:15px}
.controls button:hover{border-color:var(--spine);color:var(--ink)}

.readout{position:absolute;left:14px;top:14px;z-index:5;width:300px;max-height:calc(100% - 28px);overflow:auto;
  background:rgba(16,21,31,.93);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;backdrop-filter:blur(12px)}
.readout h3{margin:0 0 2px;font-size:14px}
.scope-switch{display:flex;gap:3px;margin:8px 0;background:var(--bg-2);border-radius:8px;padding:3px}
.scope-switch button{flex:1;background:none;border:0;border-radius:6px;padding:5px 2px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.scope-switch button.on{background:var(--panel-2);color:var(--spine)}
.ro-row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;padding:3px 0;border-bottom:1px solid var(--line)}
.ro-row .k{color:var(--ink-faint)}
.ro-row .v{color:var(--ink)}
.ro-sec{margin-top:10px}
.ro-sec .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.ro-list{display:flex;flex-direction:column;gap:3px}
.ro-item{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
.ro-item .bad{color:var(--s-bad)}
.ro-empty{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.bneck{cursor:pointer}
.bneck:hover{color:var(--ink)}

/* ---- inspector ---- */
.inspector{background:linear-gradient(180deg,var(--bg-2),var(--bg));border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.insp-head .eyebrow{display:block}
.insp-head .insp-id{font-family:var(--mono);font-size:12px;color:var(--ink);margin-top:3px;word-break:break-all}
.insp-x{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;width:26px;height:26px;color:var(--ink-dim);font-size:15px;flex:none}
.insp-x:hover{border-color:var(--spine);color:var(--ink)}
.insp-body{overflow-y:auto;padding:12px 16px 40px;flex:1;min-height:0}
.field{margin-bottom:12px}
.field-label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.field-hint{display:block;font-size:10.5px;color:var(--ink-faint);margin-top:4px;font-style:italic}
.field-unit{color:var(--ink-faint)}
.clear-btn,.set-btn{background:none;border:0;color:var(--spine);font-family:var(--mono);font-size:10px;cursor:pointer;padding:0;margin-left:auto}
.set-btn{color:var(--ink-faint)}
.set-btn:hover{color:var(--spine)}
.row-add{background:var(--panel-2);border:1px dashed var(--line-2);color:var(--ink-dim);border-radius:7px;padding:5px 8px;font-size:11px;width:100%;margin-top:6px}
.row-add:hover{border-color:var(--spine);color:var(--ink)}
.row-del{background:none;border:0;color:var(--ink-faint);font-size:14px;line-height:1}
.row-del:hover{color:var(--s-bad)}
.danger{width:100%;margin-top:18px;background:var(--f-bad);border:1px solid var(--s-bad);color:#ffd9da;border-radius:8px;padding:8px;font-size:12px}
.danger:hover{background:var(--s-bad);color:#fff}
.static-val{font-family:var(--mono);font-size:12px;color:var(--ink)}
.static-val.dim{color:var(--ink-dim)}
.checkrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);cursor:pointer;margin:3px 0}
.checkrow input{accent-color:var(--spine);width:15px;height:15px}
.chip-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink-dim)}
.chip-x{background:none;border:0;color:var(--ink-faint);font-size:12px;line-height:1}
.chip-x:hover{color:var(--s-bad)}
.stack-empty{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.inline-row{display:flex;gap:6px;align-items:center}
.inline-row .field-input{flex:1}
.slot-group{border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:6px;background:var(--bg-2)}
.slot-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.slot-row:last-child{margin-bottom:0}
.slot-x,.slot-unit,.slot-total{font-family:var(--mono);font-size:10px;color:var(--ink-faint);white-space:nowrap}
.slot-cat-dot{width:9px;height:9px;border-radius:50%;flex:none}
.recipe-summary{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px}
.recipe-io{display:flex;gap:8px;margin-top:4px}
.recipe-io-label{font-family:var(--mono);font-size:10px;color:var(--ink-faint);width:22px;flex:none;padding-top:2px}
.recipe-chips{display:flex;flex-wrap:wrap;gap:4px}
.recipe-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
.recipe-list{max-height:220px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:8px}
.recipe-opt{padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px}
.recipe-opt:last-child{border-bottom:0}
.recipe-opt:hover{background:var(--panel)}

/* combobox */
.combo{position:relative}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:30;max-height:240px;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 18px 44px -18px #000}
.combo-opt{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12px;cursor:pointer;color:var(--ink-dim)}
.combo-opt:hover,.combo-opt.active{background:var(--panel-2);color:var(--ink)}
.combo-opt .dot{width:8px;height:8px;border-radius:50%;flex:none}
.combo-empty{padding:7px 9px;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}

.mi-body{display:flex;flex-direction:column;gap:7px;margin-top:7px}
.mi-msg{font-family:var(--mono);font-size:10.5px;color:var(--s-ref)}
.mi-msg.bad{color:var(--s-bad)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:9px 14px;font-size:12.5px;box-shadow:0 18px 44px -18px #000;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.bad{border-color:var(--s-bad)}

.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--ink-dim)}
.boot .eyebrow{color:var(--spine)}
</style>
</head>
<body>
<div id="app" class="shell">
  <div class="stage boot" id="bootmsg">
    <p class="eyebrow">Bridge</p>
    <div class="mono">connecting…</div>
  </div>
</div>
<!-- Standalone export injects the baked World here (view-only, no backend). -->
<script id="world-data" type="application/json"><!--WORLD_DATA_INJECTION_POINT--></script>
<script>
"use strict";
/* ============================================================================
   Process Simulation — single-file UI (vanilla JS, no build step).
   Talks to backend.Api over the pywebview bridge (desktop) or POST /api/<method>
   (server). The World is the single source of truth; every structural gesture
   and field edit goes through apply_edit and is followed by a recompute.
   ============================================================================ */

/* ---- tiny DOM builders ---- */
function el(tag, props){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(n.style,v);
    else if(k==="html") n.innerHTML=v;
    else if(k.slice(0,2)==="on"&&typeof v==="function") n.addEventListener(k.slice(2).toLowerCase(),v);
    else n.setAttribute(k, v===true?"":v);
  }
  for(let i=2;i<arguments.length;i++) add(n, arguments[i]);
  return n;
}
function add(n, c){
  if(c==null||c===false) return;
  if(Array.isArray(c)){ c.forEach(x=>add(n,x)); return; }
  n.append(c.nodeType? c : document.createTextNode(c));
}
function svg(tag, attrs){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if(attrs) for(const k in attrs){ if(attrs[k]!=null) n.setAttribute(k, attrs[k]); }
  return n;
}
const $ = s => document.querySelector(s);

/* ---- transport: pywebview bridge, else HTTP; unwrap the {ok,data} envelope ---- */
async function rawCall(method, args){
  if(window.pywebview && window.pywebview.api && window.pywebview.api[method]){
    return await window.pywebview.api[method](...args);
  }
  const r = await fetch("api/"+method, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({args})
  });
  if(!r.ok){
    let msg = "HTTP "+r.status;
    try{ const j = await r.json(); if(j.error) msg = j.error; }catch(e){}
    throw new Error(msg);
  }
  const j = await r.json();
  return j.result;
}
async function callApi(method, ...args){
  const env = await rawCall(method, args);
  if(env && typeof env==="object" && "ok" in env){
    if(!env.ok) throw new Error((env.error&&env.error.message) || "call failed");
    return env.data;
  }
  return env; // tolerate a bare result
}
function hasBackend(){
  return (window.pywebview && window.pywebview.api) || location.protocol.startsWith("http");
}

/* ============================================================================
   State
   ============================================================================ */
let WORLD = null;
let REPORT = null;
let SYSTEM_REPORTS = {};
let SEL = null;                 // {kind,id} | null
let SCOPE = "world";
let SYSTEM_ID = null;
let MULTI = new Set();          // canvas multi-selected node ids (for grouping)
let view = {x:0, y:0, k:1};
const HISTORY = [];             // undo snapshots (world dicts)
let BY = {items:{},defs:{},recipes:{},nodes:{},systems:{},junctions:{}};

function reindex(){
  const idx = {items:{},defs:{},recipes:{},nodes:{},systems:{},junctions:{}};
  (WORLD.items||[]).forEach(i=>idx.items[i.id]=i);
  (WORLD.machineDefs||[]).forEach(d=>idx.defs[d.id]=d);
  (WORLD.recipes||[]).forEach(r=>idx.recipes[r.id]=r);
  (WORLD.nodes||[]).forEach(n=>idx.nodes[n.id]=n);
  (WORLD.systems||[]).forEach(s=>idx.systems[s.id]=s);
  (WORLD.pipeNodes||[]).forEach(j=>idx.junctions[j.id]=j);
  BY = idx;
}

/* ============================================================================
   Constants & maps
   ============================================================================ */
const CATEGORY_COLOR = { solid:"var(--s-teach)", liquid:"var(--s-indep)", energy:"var(--subedge)" };
const catColor = c => CATEGORY_COLOR[c] || "var(--ink-faint)";
const STATUS_COLOR = { ok:"var(--s-ref)", shortfall:"var(--s-bad)", overflow:"var(--s-learn)", stalled:"var(--s-not)" };
const STATUS_FILL  = { ok:"var(--f-ref)", shortfall:"var(--f-bad)", overflow:"var(--f-learn)", stalled:"var(--f-not)" };
const statusColor = s => STATUS_COLOR[s||"stalled"];
const TPS = 20;
const toPerTick = v => v/TPS, toPerSecond = v => v*TPS;

function defaultMovementCapacity(cat){
  if(cat==="solid") return 16;
  if(cat==="liquid") return 1e9;
  return 5120; // energy: 256 EU/t × 20
}

/* ---- unit scaling ---- */
function scaleMag(m){
  const a = Math.abs(m);
  const S=[[1e9,1e9,"G"],[1e6,1e6,"M"],[1e3,1e3,"k"]];
  for(const [t,d,s] of S) if(a>=t) return {v:sig(m/d), s};
  return {v:sig(m), s:""};
}
function sig(v,n=3){ if(v===0) return "0"; return Number(v.toPrecision(n)).toString(); }
function fmtRateFor(cat, rate){
  if(cat==="energy"){ const {v,s}=scaleMag(toPerTick(rate)); return `${v}${s} EU/t`; }
  const {v,s}=scaleMag(rate); return `${v}${s}${cat==="liquid"?" mB":""}/s`;
}
function fmtEnergy(perSec){
  const pt=toPerTick(perSec), sign=pt>0?"+":pt<0?"−":"";
  const {v,s}=scaleMag(Math.abs(pt)); return `${sign}${v}${s} EU/t`;
}
function fmtCapacity(v, cat){
  const unit = cat==="liquid"?" mB":cat==="energy"?" EU":"";
  const {v:val,s}=scaleMag(v); return `${val}${s}${unit}`;
}

/* ---- ids & references ---- */
function slugify(name){
  const s=(name||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").replace(/_+/g,"_");
  return s||"item";
}
const KIND_FIELD = { item:"items", recipe:"recipes", machineDef:"machineDefs", node:"nodes", pipe:"pipes", pipeNode:"pipeNodes", system:"systems" };
function idsOfKind(kind){ return new Set((WORLD[KIND_FIELD[kind]]||[]).map(e=>e.id)); }
function uniqueId(base, taken){ if(!taken.has(base)) return base; for(let i=2;;i++){ const c=`${base}_${i}`; if(!taken.has(c)) return c; } }
function idFromName(kind, name){ return uniqueId(slugify(name), idsOfKind(kind)); }
function freshId(prefix, taken){ for(let i=1;;i++){ const c=`${prefix}_${i}`; if(!taken.has(c)) return c; } }

function renameEntity(w, kind, oldId, newId){
  if(oldId===newId) return w;
  w = structuredClone(w);
  const ren = list => (list||[]).map(e=> e.id===oldId?{...e,id:newId}:e);
  if(kind==="item"){
    w.items = ren(w.items);
    const reStack = s => { const n={...s}; if(n.itemId===oldId)n.itemId=newId; if(n.tag===oldId)n.tag=newId; return n; };
    for(const r of w.recipes||[]){ r.inputs=(r.inputs||[]).map(reStack); r.outputs=(r.outputs||[]).map(reStack); }
    for(const d of w.machineDefs||[]){ if(d.sourceItemId===oldId)d.sourceItemId=newId; if(d.inputItemId===oldId)d.inputItemId=newId; if(d.outputItemId===oldId)d.outputItemId=newId;
      if(d.members) d.members=d.members.map(m=>m===oldId?newId:m); }
    for(const it of w.items||[]){ if(it.members) it.members=it.members.map(m=>m===oldId?newId:m); }
  } else if(kind==="recipe"){
    w.recipes = ren(w.recipes);
    for(const d of w.machineDefs||[]) if(d.allowedRecipeIds) d.allowedRecipeIds=d.allowedRecipeIds.map(x=>x===oldId?newId:x);
    for(const n of w.nodes||[]) if(n.recipeId===oldId) n.recipeId=newId;
  } else if(kind==="machineDef"){
    w.machineDefs = ren(w.machineDefs);
    for(const n of w.nodes||[]) if(n.machineDefId===oldId) n.machineDefId=newId;
  }
  return w;
}

/* ---- ports from a def's slot layout ---- */
function portId(cat, dir){ return cat+":"+dir; }
function parsePortId(id){
  if(!id) return null;
  const [c,d]=id.split(":");
  if((c==="solid"||c==="liquid"||c==="energy")&&(d==="in"||d==="out")) return {category:c,direction:d};
  return null;
}
function portsForDef(def){
  if(!def || !def.slots || !def.slots.length) return [];
  const merged = new Map();
  for(const g of def.slots){
    const id=portId(g.category,g.direction);
    const cap=(g.slots||0)*(g.stackSize||0);
    if(merged.has(id)) merged.get(id).capacity+=cap;
    else merged.set(id,{id,category:g.category,direction:g.direction,capacity:cap});
  }
  const dirRank={in:0,out:1}, catRank={solid:0,liquid:1,energy:2};
  return [...merged.values()].sort((a,b)=> dirRank[a.direction]-dirRank[b.direction] || catRank[a.category]-catRank[b.category]);
}

/* ---- systems: collapse state & flattening ---- */
function flattenSystem(sysId, seen){
  seen = seen || new Set();
  const nodeIds = new Set(), systemIds = new Set();
  const walk = id => {
    if(seen.has(id)) return; seen.add(id);
    const s = BY.systems[id]; if(!s) return;
    systemIds.add(id);
    (s.memberNodeIds||[]).forEach(n=>nodeIds.add(n));
    (s.memberSystemIds||[]).forEach(walk);
  };
  walk(sysId);
  systemIds.delete(sysId);
  return {nodeIds, systemIds};
}
function collapseState(){
  const collapsed = (WORLD.systems||[]).filter(s=>s.collapsed);
  const flat = new Map(collapsed.map(s=>[s.id, flattenSystem(s.id)]));
  const nested = new Set();
  for(const s of collapsed) for(const o of collapsed)
    if(s.id!==o.id && flat.get(o.id).systemIds.has(s.id)) nested.add(s.id);
  const rendered = collapsed.filter(s=>!nested.has(s.id));
  const hidden = new Set(), proxyForNode = new Map();
  for(const s of rendered) for(const n of flat.get(s.id).nodeIds){ hidden.add(n); if(!proxyForNode.has(n)) proxyForNode.set(n,s.id); }
  return {rendered, hidden, proxyForNode};
}
function centroidOf(nodeIds){
  const pts = nodeIds.map(id=>BY.nodes[id]).filter(n=>n&&n.x!=null&&n.y!=null);
  if(!pts.length) return {x:0,y:0};
  const sx=pts.reduce((a,n)=>a+n.x,0), sy=pts.reduce((a,n)=>a+n.y,0);
  return {x:Math.round(sx/pts.length), y:Math.round(sy/pts.length)};
}
function freshSystemId(){ return freshId("system", idsOfKind("system")); }

/* ---- sparse-field helpers ---- */
function withField(o,k,v){ return {...o,[k]:v}; }
function withoutField(o,k){ const n={...o}; delete n[k]; return n; }

/* ============================================================================
   Edit pipeline — snapshot, apply, re-render, recompute
   ============================================================================ */
let BUSY = false;
function snapshot(){ HISTORY.push(structuredClone(WORLD)); if(HISTORY.length>100) HISTORY.shift(); updateUndo(); }
function updateUndo(){ const b=$("#undoBtn"); if(b) b.disabled = HISTORY.length===0; }

async function applyEdits(edits, {record=true}={}){
  if(!edits.length) return;
  if(record) snapshot();
  try{
    let next=null;
    for(const e of edits) next = await callApi("apply_edit", e);
    if(next){ WORLD=next; reindex(); }
  }catch(err){ toast(err.message,true); }
  renderAll();
  await recompute();
}
async function replaceWorld(next, {record=true}={}){
  if(record) snapshot();
  try{ WORLD = await callApi("set_world", next); reindex(); }
  catch(err){ toast(err.message,true); }
  renderAll();
  await recompute();
}
function upsert(kind, entity){ return {op:"upsert", kind, entity}; }
function removeEdit(kind, id){ return {op:"remove", kind, id}; }

function recomputeRequest(){
  if(SCOPE==="world") return {scope:"world"};
  if(SCOPE==="node")  return SEL&&SEL.kind==="node"? {scope:"node",nodeId:SEL.id} : null;
  if(SCOPE==="process") return SEL&&SEL.kind==="node"? {scope:"process",nodeId:SEL.id} : null;
  if(SCOPE==="system") return SYSTEM_ID? {scope:"system",systemId:SYSTEM_ID} : null;
  return null;
}
async function recompute(){
  const req = recomputeRequest();
  if(!req){ REPORT=null; }
  else { try{ REPORT = await callApi("recompute", req); }catch(e){ REPORT=null; } }
  // per-collapsed-system aggregate reports
  const ids = collapseState().rendered.map(s=>s.id);
  const sr={};
  for(const id of ids){ try{ sr[id] = await callApi("recompute",{scope:"system",systemId:id}); }catch(e){} }
  SYSTEM_REPORTS = sr;
  paintOverlay();
  renderReadout();
}

function undo(){
  const prev = HISTORY.pop(); updateUndo();
  if(prev) replaceWorld(prev, {record:false});
}

/* ---------- rail ---------- */
const railOpen = { nodes:true, systems:true, items:false, recipes:false, machineDefs:false };
let railQuery = "";
const railSearchCollapsed = new Set(); // sections manually collapsed while a search is active
const RAIL_CAP = 60;

function renderRail(){
  let rail = $("#rail");
  if(!rail){ rail = el("aside",{class:"rail",id:"rail"}); $("#app").prepend(rail); }
  rail.textContent="";
  rail.append(
    el("div",{class:"brand"},
      el("p",{class:"eyebrow"},"Production Chain Planner"),
      el("h1",null,"Process Simulation"),
      el("div",{class:"sub"},"rate-balance · node graph")),
  );
  const scroll = el("div",{class:"rail-scroll"});
  rail.append(scroll);

  scroll.append(el("div",{class:"rail-head"},
    el("button",{class:"tool-btn",id:"undoBtn",disabled:HISTORY.length===0,title:"Undo (Ctrl+Z)",onclick:undo},"↶ Undo"),
    el("button",{class:"tool-btn",title:"Save / load project",onclick:openProjectDialog},"⇄ Project")
  ));

  scroll.append(miImportSection());

  // search
  const search = el("input",{class:"field-input mono",type:"text",placeholder:"search library…",value:railQuery,
    oninput:e=>{ railQuery=e.target.value; if(railQuery.trim()==="") railSearchCollapsed.clear(); renderRailSections(); }});
  scroll.append(el("div",{class:"rail-search"}, search));

  const sectionsHost = el("div",{id:"railSections"});
  scroll.append(sectionsHost);
  renderRailSections();
}

function railMatch(label,id){ const q=railQuery.trim().toLowerCase(); return q===""||(label||"").toLowerCase().includes(q)||(id||"").toLowerCase().includes(q); }
function cmp(a,b){ return (a||"").localeCompare(b||"", undefined, {numeric:true,sensitivity:"base"}); }

function renderRailSections(){
  const host=$("#railSections"); if(!host) return; host.textContent="";
  const defName = id => (BY.defs[id]&&BY.defs[id].name)||id;
  const sections=[
    {key:"nodes",title:"Nodes",rows:(WORLD.nodes||[]).map(n=>({kind:"node",id:n.id,label:defName(n.machineDefId),dot:"var(--s-not)"}))},
    {key:"systems",title:"Systems",rows:(WORLD.systems||[]).map(s=>({kind:"system",id:s.id,label:s.name||s.id,dot:"var(--s-expert)"}))},
    {key:"items",title:"Items",add:"item",rows:(WORLD.items||[]).map(i=>({kind:"item",id:i.id,label:i.name||i.id,dot:i.isTag?"var(--ink-faint)":catColor(i.category)}))},
    {key:"recipes",title:"Recipes",add:"recipe",rows:(WORLD.recipes||[]).map(r=>({kind:"recipe",id:r.id,label:r.name||r.id,dot:"var(--subedge)"}))},
    {key:"machineDefs",title:"Machine defs",add:"machineDef",drag:true,rows:(WORLD.machineDefs||[]).map(d=>({kind:"machineDef",id:d.id,label:d.name||d.id,dot:"var(--s-teach)"}))},
  ];
  for(const sec of sections){
    const filtered = sec.rows.filter(r=>railMatch(r.label,r.id)).sort((a,b)=>cmp(a.label,b.label));
    // While searching, sections default open (so matches show) but can still be
    // collapsed individually; otherwise the persistent per-section toggle governs.
    const searching = railQuery.trim()!=="";
    const open = searching ? !railSearchCollapsed.has(sec.key) : railOpen[sec.key];
    const head = el("div",{class:"rail-section-head"},
      el("button",{class:"rail-section-toggle eyebrow quiet",onclick:()=>{ if(searching){ railSearchCollapsed.has(sec.key)?railSearchCollapsed.delete(sec.key):railSearchCollapsed.add(sec.key); } else { railOpen[sec.key]=!railOpen[sec.key]; } renderRailSections(); }},
        el("span",{class:"rail-caret"+(open?" open":"")},"▸"), sec.title,
        el("span",{class:"rail-count mono"}, String(sec.rows.length))),
      sec.add? el("button",{class:"rail-add",title:"New "+sec.title.toLowerCase().replace(/s$/,""),onclick:()=>createEntity(sec.add)},"+"):null
    );
    const body = el("div");
    if(open){
      if(filtered.length===0) body.append(el("div",{class:"leaf"},"none"));
      else{
        filtered.slice(0,RAIL_CAP).forEach(r=>body.append(leaf(r,sec.drag)));
        if(filtered.length>RAIL_CAP) body.append(el("div",{class:"leaf rail-more mono"},`+${filtered.length-RAIL_CAP} more — search to narrow`));
      }
    }
    host.append(el("div",{class:"rail-section"}, head, body));
  }
}
function leaf(r, draggable){
  const seld = SEL && SEL.kind===r.kind && SEL.id===r.id;
  const node = el("div",{class:"leaf clickable"+(seld?" selected":"")+(draggable?" draggable":""),
    onclick:()=>select(r.kind, r.id)},
    el("span",{class:"dot",style:{background:r.dot}}),
    el("span",null,r.label),
    el("span",{class:"leaf-id"},r.id));
  if(draggable){
    node.setAttribute("draggable","true");
    node.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/def-id", r.id); e.dataTransfer.effectAllowed="copy"; });
  }
  return node;
}

/* ---------- graph (canvas) ---------- */
const NODE_W=210, HEAD_H=0; // HEAD height measured per node at render via layout model
function portAnchors(def){
  // deterministic anchor layout matching the rendered node body
  const ports=portsForDef(def);
  const ins=ports.filter(p=>p.direction==="in"), outs=ports.filter(p=>p.direction==="out");
  return {ins,outs,rows:Math.max(ins.length,outs.length,1)};
}

function renderGraph(){
  let canvas=$("#canvas");
  if(!canvas){
    const stage=el("section",{class:"stage",id:"stage"});
    canvas=el("div",{class:"canvas",id:"canvas"});
    const vp=el("div",{id:"viewport"});
    vp.append(svg("svg",{id:"edges"}));
    canvas.append(vp);
    stage.append(canvas, paletteEl(), legendEl(), controlsEl(), el("div",{id:"readout"}));
    // replace boot / insert as middle column
    const boot=$("#bootmsg"); if(boot) boot.remove();
    const app=$("#app");
    const existing=$("#stage");
    if(existing) existing.replaceWith(stage); else app.insertBefore(stage, $("#inspector"));
    wireCanvas(canvas);
  }
  const vp=$("#viewport");
  // clear old nodes, systems, and junctions (keep the edges svgs) — a stale
  // junction left behind would ghost at its former spot after a move.
  [...vp.querySelectorAll(".node,.sys,.junction")].forEach(n=>n.remove());
  const edges=$("#edges"); edges.textContent="";
  let edgesHit=$("#edges-hit");
  if(!edgesHit){ edgesHit=svg("svg",{id:"edges-hit"}); vp.append(edgesHit); }
  edgesHit.textContent="";

  const cs = collapseState();
  const anchorPos = {}; // key -> {x,y} scene coords for pipe endpoints

  // Fallback grid for nodes authored without coordinates, so they never stack
  // at the origin (dragging then persists real x/y, which win).
  let fbIdx=0;
  const fallback=()=>({x:(fbIdx%4)*250, y:Math.floor(fbIdx/4)*170, _i:fbIdx++});

  // machine nodes
  for(const n of WORLD.nodes||[]){
    if(cs.hidden.has(n.id)) continue;
    const def=BY.defs[n.machineDefId];
    const fb = (n.x==null||n.y==null)? fallback() : null;
    const x = n.x!=null?n.x:fb.x, y=n.y!=null?n.y:fb.y;
    const {ins,outs,rows}=portAnchors(def);
    const dom = nodeDom(n, def, ins, outs);
    dom.style.left=x+"px"; dom.style.top=y+"px";
    const spacer = dom.querySelector(".nports");
    spacer.style.height = (rows*22+8)+"px";
    vp.append(dom);
    // measure head height (everything above the ports area) to place anchors;
    // ports are absolute children of the node, so their `top` is node-relative.
    const headH = spacer.offsetTop;
    const place=(list,dir)=>list.forEach((p,i)=>{
      const rowY = headH + (i+0.5)*22 + 6;
      const px = dir==="in"? 0 : NODE_W;
      anchorPos[n.id+"|"+p.id] = {x:x+px, y:y+rowY};
      const dot=el("div",{class:"port "+dir,style:{top:rowY+"px",background:catColor(p.category)},
        title:p.category+" "+dir,"data-node":n.id,"data-port":p.id,"data-cat":p.category,"data-dir":dir});
      dot.addEventListener("pointerdown",startConnect);
      dom.append(dot);
      dom.append(el("div",{class:"plabel "+dir,style:{top:rowY+"px"}},p.category));
    });
    place(ins,"in"); place(outs,"out");
  }

  // collapsed system nodes
  for(const s of cs.rendered){
    const fb=centroidOf([...flattenSystem(s.id).nodeIds]);
    const x=s.x!=null?s.x:fb.x, y=s.y!=null?s.y:fb.y;
    const dom=sysDom(s);
    dom.style.left=x+"px"; dom.style.top=y+"px";
    vp.append(dom);
    anchorPos["sys:"+s.id+"|in"]={x, y:y+dom.offsetHeight/2};
    anchorPos["sys:"+s.id+"|out"]={x:x+190, y:y+dom.offsetHeight/2};
  }

  // pipe junctions (small routing dots) — one anchor at the dot centre
  const JUNC=new Set();
  let jIdx=0;
  for(const j of WORLD.pipeNodes||[]){
    JUNC.add(j.id);
    const fb=(j.x==null||j.y==null)?{x:60+(jIdx%6)*40, y:60+Math.floor(jIdx/6)*40}:null; jIdx++;
    const x=j.x!=null?j.x:fb.x, y=j.y!=null?j.y:fb.y;
    const dom=junctionDom(j);
    dom.style.left=x+"px"; dom.style.top=y+"px";
    vp.append(dom);
    anchorPos["j:"+j.id]={x, y};
  }
  // a pipe end at a junction resolves to that single centre anchor
  const endKey=(end,fallbackDir,cat)=>JUNC.has(end.nodeId)
    ? "j:"+end.nodeId
    : end.nodeId+"|"+(end.port||portId(cat,fallbackDir));

  // edges (pipes), re-pointed across collapsed boundaries
  for(const p of WORLD.pipes||[]){
    const aProxy=cs.proxyForNode.get(p.a.nodeId)||null;
    const bProxy=cs.proxyForNode.get(p.b.nodeId)||null;
    if(aProxy && aProxy===bProxy) continue; // internal to one collapsed system
    const aKey = aProxy? "sys:"+aProxy+"|out" : endKey(p.a,"out",p.category);
    const bKey = bProxy? "sys:"+bProxy+"|in"  : endKey(p.b,"in",p.category);
    const a=anchorPos[aKey], b=anchorPos[bKey];
    if(!a||!b) continue;
    const d=edgePath(a,b);
    // wide transparent hit path (reliable clicking) + the visible edge
    const hit=svg("path",{d,fill:"none",stroke:"transparent","stroke-width":16,
      "data-pipe":p.id,class:"pipe-hit"});
    hit.style.cursor="pointer";
    hit.addEventListener("pointerdown",e=>{ e.stopPropagation(); select("pipe",p.id); });
    const path=svg("path",{d,fill:"none",stroke:catColor(p.category),"stroke-width":2,
      "data-pipe":p.id,class:"pipe-edge"});
    $("#edges").append(path);
    edgesHit.append(hit);
  }

  // temp connect line placeholder
  $("#edges").append(svg("path",{id:"tempEdge",fill:"none","stroke-dasharray":"5 4","stroke-width":2,stroke:"var(--spine)",style:"display:none"}));

  // Keep the transparent pipe hit-layer BELOW the nodes (it was appended before
  // them): a click on a node body selects the node, not a pipe routed behind it.
  // Pipe strokes in open space stay clickable; only the stretch hidden under a
  // card yields to the card, which is what the eye expects.
  vp.insertBefore(edgesHit, vp.querySelector(".node,.sys,.junction"));
  applyView();
}
function edgePath(a,b){
  const dx=Math.max(40, Math.abs(b.x-a.x)*0.5);
  return `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
}

function nodeDom(n, def, ins, outs){
  const seld = SEL&&SEL.kind==="node"&&SEL.id===n.id;
  const title = (def&&def.name)||n.machineDefId;
  const meta=[];
  if(n.recipeId) meta.push(n.recipeId);
  if(n.overclock!=null && n.overclock!==1) meta.push("×"+n.overclock);
  if(n.count!=null && n.count!==1) meta.push("∥"+n.count);
  const dom=el("div",{class:"node"+(seld||MULTI.has(n.id)?" selected":""),"data-id":n.id},
    el("span",{class:"nbar","data-bar":n.id}),
    el("div",{class:"nhead"},
      el("span",{class:"ntitle"},title),
      el("span",{class:"nid"},n.id)),
  );
  const metaRow=el("div",{class:"nmeta"},"data-meta"); metaRow.textContent="";
  metaRow.setAttribute("data-meta",n.id);
  if(meta.length) metaRow.append(el("span",{class:"chip mono"},meta.join("  ")));
  dom.append(metaRow);
  if(def&&def.storage) dom.append(el("div",{class:"nstore mono"},"▭ "+fmtCapacity(def.storage.capacity*(n.count||1),def.storage.category)));
  dom.append(el("div",{class:"nports"}));
  // header drag + select (shift-click toggles multi-select for grouping)
  // drag from anywhere on the body; ports/buttons stopPropagation so they still work
  dom.addEventListener("pointerdown",e=>startNodeDrag(e,n.id,dom,"node"));
  dom.addEventListener("click",e=>{ e.stopPropagation(); if(dragMoved) return;
    if(e.shiftKey) toggleMulti(n.id); else select("node",n.id); });
  return dom;
}
function sysDom(s){
  const seld=SEL&&SEL.kind==="system"&&SEL.id===s.id;
  const rep=SYSTEM_REPORTS[s.id];
  const count=flattenSystem(s.id).nodeIds.size;
  const st = rep? aggregateStatus(rep): null;
  const dom=el("div",{class:"sys"+(seld?" selected":""),"data-sys":s.id},
    el("div",{class:"nhead"},
      el("span",{class:"sicon"},"▦"),
      el("span",{class:"ntitle"}, s.name||s.id),
      el("button",{class:"expand",title:"Expand",onpointerdown:e=>e.stopPropagation(),onclick:e=>{ e.stopPropagation(); toggleCollapse(s.id); }},"expand")),
    el("div",{class:"smeta"}, `${count} machine${count===1?"":"s"}`+(st?" · "+st:"")+(rep&&rep.netEnergy?" · "+fmtEnergy(rep.netEnergy):""))
  );
  dom.addEventListener("pointerdown",e=>startNodeDrag(e,s.id,dom,"system"));
  dom.addEventListener("click",e=>{ e.stopPropagation(); if(!dragMoved) select("system",s.id); });
  return dom;
}
function junctionDom(j){
  const seld=SEL&&SEL.kind==="pipeNode"&&SEL.id===j.id;
  const dom=el("div",{class:"junction"+(seld?" selected":""),"data-junction":j.id,title:j.category+" junction · "+j.id},
    el("div",{class:"jdot",style:{background:catColor(j.category)}}));
  // connect-from handle: pull a new pipe out of the junction (source side)
  const nub=el("div",{class:"jnub",style:{background:catColor(j.category)},title:"drag to wire out"});
  nub.addEventListener("pointerdown",e=>startConnect(e,{nodeId:j.id,port:null,cat:j.category,dir:"out",junction:true}));
  dom.append(nub);
  // drag the body to move; click selects
  dom.addEventListener("pointerdown",e=>startNodeDrag(e,j.id,dom,"pipeNode"));
  dom.addEventListener("click",e=>{ e.stopPropagation(); if(!dragMoved) select("pipeNode",j.id); });
  return dom;
}
function aggregateStatus(rep){
  const st=Object.values(rep.balances||{}).map(b=>b.status);
  if(st.includes("shortfall")) return "shortfall";
  if(st.includes("overflow")) return "overflow";
  if(st.includes("ok")) return "ok";
  return null;
}

function applyView(){ $("#viewport").style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function viewportBox(){ const r=$("#canvas").getBoundingClientRect(); return {w:r.width,h:r.height,cx:r.width/2,cy:r.height/2}; }
function fit(){
  const cs=collapseState();
  const pts=[];
  for(const n of WORLD.nodes||[]){ if(cs.hidden.has(n.id)) continue; pts.push({x:n.x||0,y:n.y||0,w:NODE_W,h:160}); }
  for(const s of cs.rendered){ const fb=centroidOf([...flattenSystem(s.id).nodeIds]); pts.push({x:s.x!=null?s.x:fb.x,y:s.y!=null?s.y:fb.y,w:190,h:90}); }
  const vb=viewportBox();
  if(!pts.length){ view={x:vb.cx, y:vb.cy, k:1}; applyView(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+p.w); maxY=Math.max(maxY,p.y+p.h); }
  const w=maxX-minX, h=maxY-minY, pad=0.15;
  const k=Math.min(2, Math.max(0.2, Math.min(vb.w*(1-pad)/w, vb.h*(1-pad)/h, 1)));
  view={k, x: vb.cx - (minX+w/2)*k, y: vb.cy - (minY+h/2)*k};
  applyView();
}

function zoomBy(f){
  const vb=viewportBox();
  const nk=Math.min(2.5,Math.max(0.2,view.k*f));
  view.x=vb.cx-(vb.cx-view.x)*(nk/view.k);
  view.y=vb.cy-(vb.cy-view.y)*(nk/view.k);
  view.k=nk; applyView();
}

/* ---------- canvas interactions ---------- */
let pan=null, dragMoved=false;
function wireCanvas(canvas){
  canvas.addEventListener("pointerdown",e=>{
    if(e.target.closest(".node")||e.target.closest(".sys")||e.target.closest(".port")||e.target.closest(".junction")) return;
    if(e.target.closest("path.pipe-edge")) return;
    pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y}; dragMoved=false;
    canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(nodeDrag){ moveNodeDrag(e); return; }
    if(!pan) return;
    const dx=e.clientX-pan.sx, dy=e.clientY-pan.sy;
    if(Math.hypot(dx,dy)>4) dragMoved=true;
    view.x=pan.vx+dx; view.y=pan.vy+dy; applyView();
  });
  canvas.addEventListener("pointerup",e=>{
    if(nodeDrag){ endNodeDrag(e); return; }
    const wasClick = pan && !dragMoved;
    pan=null; canvas.classList.remove("dragging");
    if(wasClick) clearSel();
  });
  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=canvas.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const f=e.deltaY<0?1.12:1/1.12, nk=Math.min(2.5,Math.max(0.2,view.k*f));
    view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; applyView();
  },{passive:false});
  // drop a machine def from the rail
  canvas.addEventListener("dragover",e=>{ if(e.dataTransfer.types.includes("text/def-id")){ e.preventDefault(); e.dataTransfer.dropEffect="copy"; } });
  canvas.addEventListener("drop",e=>{
    const id=e.dataTransfer.getData("text/def-id"); if(!id) return; e.preventDefault();
    const d=BY.defs[id]; if(!d) return;
    const p=screenToScene(e.clientX,e.clientY); placeMachine(d,p);
  });
}
function screenToScene(cx,cy){
  const r=$("#canvas").getBoundingClientRect();
  return {x:(cx-r.left-view.x)/view.k, y:(cy-r.top-view.y)/view.k};
}

/* node / system drag */
let nodeDrag=null;
function startNodeDrag(e,id,dom,kind){
  e.stopPropagation();
  dom.setPointerCapture(e.pointerId);
  const cur=kind==="system"?BY.systems[id]:kind==="pipeNode"?BY.junctions[id]:BY.nodes[id];
  const startX=cur.x!=null?cur.x:0, startY=cur.y!=null?cur.y:0;
  nodeDrag={id,dom,kind,sx:e.clientX,sy:e.clientY,startX,startY,moved:false};
  dragMoved=false;
  dom.classList.add("dragging");
}
function moveNodeDrag(e){
  const d=nodeDrag;
  const nx=d.startX+(e.clientX-d.sx)/view.k, ny=d.startY+(e.clientY-d.sy)/view.k;
  if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>3){ d.moved=true; dragMoved=true; }
  d.dom.style.left=Math.round(nx)+"px"; d.dom.style.top=Math.round(ny)+"px";
  // live-update pipes by re-rendering edges cheaply
  d._nx=Math.round(nx); d._ny=Math.round(ny);
  liveRedrawEdges();
}
function endNodeDrag(e){
  const d=nodeDrag; nodeDrag=null; d.dom.classList.remove("dragging");
  if(!d.moved){ return; }
  const x=d._nx!=null?d._nx:d.startX, y=d._ny!=null?d._ny:d.startY;
  if(d.kind==="system"){ const s=BY.systems[d.id]; applyEdits([upsert("system",{...s,x,y})]); }
  else if(d.kind==="pipeNode"){ const j=BY.junctions[d.id]; applyEdits([upsert("pipeNode",{...j,x,y})]); }
  else { const n=BY.nodes[d.id]; applyEdits([upsert("node",{...n,x,y})]); }
}
function liveRedrawEdges(){
  // recompute anchors from current DOM positions and redraw edges only
  const vp=$("#viewport");
  const posOf=(dom)=>({x:parseFloat(dom.style.left)||0, y:parseFloat(dom.style.top)||0});
  const anchors={};
  vp.querySelectorAll(".node").forEach(dom=>{
    const id=dom.getAttribute("data-id"); const p=posOf(dom);
    dom.querySelectorAll(".port").forEach(pt=>{
      const port=pt.getAttribute("data-port"), dir=pt.getAttribute("data-dir");
      const py=parseFloat(pt.style.top); anchors[id+"|"+port]={x:p.x+(dir==="in"?0:NODE_W), y:p.y+py};
    });
  });
  vp.querySelectorAll(".sys").forEach(dom=>{
    const id=dom.getAttribute("data-sys"); const p=posOf(dom);
    anchors["sys:"+id+"|in"]={x:p.x,y:p.y+dom.offsetHeight/2};
    anchors["sys:"+id+"|out"]={x:p.x+190,y:p.y+dom.offsetHeight/2};
  });
  const JUNC=new Set();
  vp.querySelectorAll(".junction").forEach(dom=>{
    const id=dom.getAttribute("data-junction"); const p=posOf(dom);
    JUNC.add(id); anchors["j:"+id]={x:p.x,y:p.y};
  });
  const endKey=(end,dir,cat)=>JUNC.has(end.nodeId)?"j:"+end.nodeId:end.nodeId+"|"+(end.port||portId(cat,dir));
  const cs=collapseState();
  vp.querySelectorAll("path[data-pipe]").forEach(path=>{
    const pid=path.getAttribute("data-pipe"); const p=(WORLD.pipes||[]).find(x=>x.id===pid); if(!p) return;
    const aProxy=cs.proxyForNode.get(p.a.nodeId)||null, bProxy=cs.proxyForNode.get(p.b.nodeId)||null;
    const aKey=aProxy?"sys:"+aProxy+"|out":endKey(p.a,"out",p.category);
    const bKey=bProxy?"sys:"+bProxy+"|in":endKey(p.b,"in",p.category);
    const a=anchors[aKey],b=anchors[bKey]; if(a&&b) path.setAttribute("d",edgePath(a,b));
  });
}

/* port connect → new pipe */
let connectState=null;
function startConnect(e, explicit){
  e.stopPropagation(); e.preventDefault();
  // `explicit` is passed by a junction nub; otherwise read a machine port dot.
  let endInfo;
  if(explicit){ endInfo=explicit; }
  else{
    const dot=e.currentTarget;
    endInfo={nodeId:dot.getAttribute("data-node"), port:dot.getAttribute("data-port"),
             cat:dot.getAttribute("data-cat"), dir:dot.getAttribute("data-dir"), junction:false};
  }
  const from=screenToScene(e.clientX,e.clientY);
  connectState={...endInfo,from};
  const t=$("#tempEdge"); if(t) t.style.display="";
  window.addEventListener("pointermove", moveConnect);
  window.addEventListener("pointerup", endConnect, {once:true});
}
function moveConnect(e){
  if(!connectState) return;
  const to=screenToScene(e.clientX,e.clientY);
  const t=$("#tempEdge"); if(t) t.setAttribute("d",edgePath(connectState.from,to));
}
function endConnect(e){
  window.removeEventListener("pointermove", moveConnect);
  const t=$("#tempEdge"); if(t) t.style.display="none";
  const target=document.elementFromPoint(e.clientX,e.clientY);
  const cs=connectState; connectState=null;
  // drop target: a machine port, or a junction dot (acts as an io end)
  const portDot=target&&target.closest&&target.closest(".port");
  const juncDom=target&&target.closest&&target.closest(".junction");
  let tEnd;
  if(portDot){
    tEnd={nodeId:portDot.getAttribute("data-node"), port:portDot.getAttribute("data-port"),
          cat:portDot.getAttribute("data-cat"), dir:portDot.getAttribute("data-dir"), junction:false};
  } else if(juncDom){
    const jid=juncDom.getAttribute("data-junction"); const j=BY.junctions[jid]; if(!j) return;
    tEnd={nodeId:jid, port:null, cat:j.category, dir:"io", junction:true};
  } else return;
  // resolve source (extract) vs sink (insert). A junction end is flexible (io).
  let src,snk;
  if(cs.dir==="out"){
    if(tEnd.dir==="out"&&!tEnd.junction){ toast("connect an output to an input",true); return; }
    src=cs; snk=tEnd;
  } else { // cs started from an in-port (machine input)
    if(tEnd.dir==="in"&&!tEnd.junction){ toast("connect an output to an input",true); return; }
    src=tEnd; snk=cs;
  }
  if(src.cat!==snk.cat){ toast("ends must share a category",true); return; }
  if(src.nodeId===snk.nodeId){ toast("cannot wire a node to itself",true); return; }
  const mkEnd=(end,role)=>{ const o={nodeId:end.nodeId,role:end.junction?"io":role}; if(end.port) o.port=end.port; return o; };
  const id=freshId("pipe", idsOfKind("pipe"));
  const pipe={id,category:src.cat,movementCapacity:defaultMovementCapacity(src.cat),overclock:1,
    a:mkEnd(src,"out"), b:mkEnd(snk,"in")};
  applyEdits([upsert("pipe",pipe)]);
  select("pipe",id);
}

/* placement */
function placeMachine(def, scenePos){
  let pos=scenePos;
  if(!pos){
    const r=$("#canvas").getBoundingClientRect();
    const base=screenToScene(r.left+r.width/2, r.top+r.height/2);
    const step=(WORLD.nodes||[]).length%6;
    pos={x:base.x+step*28, y:base.y+step*28};
  }
  const id=freshId(def.id, idsOfKind("node"));
  const node={id,machineDefId:def.id,x:Math.round(pos.x),y:Math.round(pos.y)};
  applyEdits([upsert("node",node)]);
  select("node",id);
}
function placeJunction(cat, scenePos){
  let pos=scenePos;
  if(!pos){
    const r=$("#canvas").getBoundingClientRect();
    const base=screenToScene(r.left+r.width/2, r.top+r.height/2);
    const step=(WORLD.pipeNodes||[]).length%6;
    pos={x:base.x+step*24, y:base.y+step*24};
  }
  const id=freshId("junction", idsOfKind("pipeNode"));
  applyEdits([upsert("pipeNode",{id,category:cat,x:Math.round(pos.x),y:Math.round(pos.y)})]);
  select("pipeNode",id);
}

/* selection */
function select(kind,id){ SEL={kind,id}; MULTI.clear(); if(kind==="system") SYSTEM_ID=id; renderAll();
  const req=recomputeRequest(); if(req&&(SCOPE==="node"||SCOPE==="process"||SCOPE==="system")) recompute(); }
function clearSel(){ SEL=null; MULTI.clear(); renderAll(); }
// Shift-click a node to add/remove it from the multi-selection (≥2 → "Group").
function toggleMulti(id){ if(MULTI.has(id)) MULTI.delete(id); else MULTI.add(id); SEL=null; renderAll(); }

/* delete selected via keyboard */
window.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName)||"";
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
    e.preventDefault(); undo(); return;
  }
  if(e.key==="Escape"){ clearSel(); return; }
  if((e.key==="Delete"||e.key==="Backspace")&&SEL){
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
    e.preventDefault(); deleteSelected();
  }
});
function deleteSelected(){
  if(!SEL) return;
  const {kind,id}=SEL;
  if(kind==="node"){
    // also drop incident pipes
    const pipes=(WORLD.pipes||[]).filter(p=>p.a.nodeId===id||p.b.nodeId===id).map(p=>removeEdit("pipe",p.id));
    SEL=null; applyEdits([...pipes, removeEdit("node",id)]);
  } else if(kind==="pipeNode"){
    // also drop pipes incident to the junction
    const pipes=(WORLD.pipes||[]).filter(p=>p.a.nodeId===id||p.b.nodeId===id).map(p=>removeEdit("pipe",p.id));
    SEL=null; applyEdits([...pipes, removeEdit("pipeNode",id)]);
  } else if(kind==="pipe"){ SEL=null; applyEdits([removeEdit("pipe",id)]); }
  else if(kind==="system"){ SEL=null; applyEdits([removeEdit("system",id)]); }
  else if(kind==="item"||kind==="recipe"||kind==="machineDef"){ SEL=null; applyEdits([removeEdit(kind,id)]); }
}

/* grouping */
function groupSelected(){
  const cs=collapseState();
  const ids=[...MULTI].filter(id=>!cs.hidden.has(id));
  if(ids.length<2) return;
  const id=freshSystemId();
  const {x,y}=centroidOf(ids);
  MULTI.clear();
  applyEdits([upsert("system",{id,memberNodeIds:ids,collapsed:true,x,y})]);
  select("system",id);
}
function toggleCollapse(sysId){
  const s=BY.systems[sysId]; if(!s) return;
  let next={...s,collapsed:!s.collapsed};
  if(!s.collapsed){ const {x,y}=centroidOf([...flattenSystem(sysId).nodeIds]); next.x=x; next.y=y; }
  applyEdits([upsert("system",next)]);
}

/* ============================================================================
   Overlay painting (status/flow) + balance readout
   ============================================================================ */
function paintOverlay(){
  if(!$("#viewport")) return;
  const balances=(REPORT&&REPORT.balances)||{};
  const duty=(REPORT&&REPORT.nodeDuty)||{};
  const flows=(REPORT&&REPORT.pipeFlows)||{};
  for(const n of WORLD.nodes||[]){
    const dom=$(`.node[data-id="${cssEsc(n.id)}"]`); if(!dom) continue;
    const b=balances[n.id];
    const bar=dom.querySelector(".nbar"); if(bar) bar.style.background=statusColor(b&&b.status);
    dom.style.setProperty("box-shadow", (SEL&&SEL.kind==="node"&&SEL.id===n.id)?"":"");
    // status chip + duty
    const meta=dom.querySelector(`.nmeta[data-meta="${cssEsc(n.id)}"]`);
    if(meta){
      [...meta.querySelectorAll(".chip.status,.chip.duty")].forEach(x=>x.remove());
      if(b&&b.status){
        const chip=el("span",{class:"chip mono status",style:{background:STATUS_FILL[b.status],color:STATUS_COLOR[b.status]}},b.status);
        meta.prepend(chip);
      }
      const d=duty[n.id];
      if(d!=null && d<0.999){
        meta.append(el("span",{class:"chip mono duty",style:{color:(b&&b.status==="shortfall")?"var(--s-bad)":"var(--ink-dim)"}},Math.round(d*100)+"%"));
      }
    }
  }
  // edges: thickness + dash by flow
  $("#edges")&&$("#edges").querySelectorAll("path.pipe-edge").forEach(path=>{
    const pid=path.getAttribute("data-pipe"); const pf=flows[pid];
    if(pf){
      const w=2+Math.min(6, Math.log10(1+Math.abs(pf.flow)) );
      path.setAttribute("stroke-width", w.toFixed(1));
      if(pf.shortfall) path.setAttribute("stroke-dasharray","6 4"); else path.removeAttribute("stroke-dasharray");
    } else { path.setAttribute("stroke-width","2"); path.removeAttribute("stroke-dasharray"); }
    const selp = SEL&&SEL.kind==="pipe"&&SEL.id===pid;
    path.setAttribute("stroke", selp? "var(--spine)" : catColor((WORLD.pipes||[]).find(x=>x.id===pid)?.category));
  });
}
function cssEsc(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):String(s).replace(/["\\]/g,"\\$&"); }

function renderReadout(){
  const host=$("#readout"); if(!host) return; host.textContent="";
  const panel=el("div",{class:"readout"});
  panel.append(el("div",{class:"eyebrow"},"Balance"));
  // scope switch
  const sw=el("div",{class:"scope-switch"});
  for(const sc of ["world","process","node","system"]){
    sw.append(el("button",{class:SCOPE===sc?"on":"",onclick:()=>setScope(sc)}, sc));
  }
  panel.append(sw);
  const rep=REPORT;
  if(!rep){
    panel.append(el("div",{class:"ro-empty"},
      SCOPE==="node"||SCOPE==="process"?"select a machine":SCOPE==="system"?"select a system":"—"));
    host.append(panel); return;
  }
  panel.append(roRow("nodes", String((rep.nodeIds||[]).length)));
  panel.append(roRow("net energy", rep.netEnergy!=null?fmtEnergy(rep.netEnergy):"—"));
  // feedstock in
  panel.append(ioSection("Feedstock in", rep.externalInputs));
  panel.append(ioSection("Actual yield", rep.externalOutputs));
  // bottlenecks
  const bn=rep.bottlenecks||[];
  const sec=el("div",{class:"ro-sec"}, el("div",{class:"lab"},"Bottlenecks"));
  if(!bn.length) sec.append(el("div",{class:"ro-empty"},"none"));
  else{
    const list=el("div",{class:"ro-list"});
    bn.slice(0,8).forEach(b=>{
      const nm=(BY.defs[BY.nodes[b.nodeId]?.machineDefId]?.name)||b.nodeId;
      const it=(BY.items[b.itemId]?.name)||b.itemId;
      list.append(el("div",{class:"ro-item bneck",onclick:()=>select("node",b.nodeId)},
        el("span",null, nm+" · "+it),
        el("span",{class:"bad"}, "−"+fmtShort(b.shortfall))));
    });
    sec.append(list);
  }
  panel.append(sec);
  host.append(panel);
}
function fmtShort(v){ const {v:val,s}=scaleMag(v); return val+s; }
function roRow(k,v){ return el("div",{class:"ro-row"}, el("span",{class:"k"},k), el("span",{class:"v"},v)); }
function ioSection(label, map){
  const keys=Object.keys(map||{});
  const sec=el("div",{class:"ro-sec"}, el("div",{class:"lab"},label));
  if(!keys.length){ sec.append(el("div",{class:"ro-empty"},"none")); return sec; }
  const list=el("div",{class:"ro-list"});
  keys.sort((a,b)=>Math.abs(map[b])-Math.abs(map[a])).slice(0,10).forEach(k=>{
    const it=BY.items[k]; const nm=(it&&it.name)||k;

/* save an entity edit + optional rename */

function renameAndSave(kind, oldId, newId){

function textInput(value,onChange,placeholder){
  return el("input",{class:"field-input",type:"text",value:value||"",placeholder:placeholder||"",

}
function numberInput(value,onChange,opts){
  opts=opts||{};

    min:opts.min, max:opts.max, step:opts.step||"any",
    oninput:e=>{ const v=e.target.value; if(v==="") return; const n=Number(v); if(!Number.isNaN(n)) onChange(n); }});
  return inp;
}
function selectInput(value,options,onChange){
  const s=el("select",{class:"field-input",onchange:e=>onChange(e.target.value)});
  for(const o of options){ const op=el("option",{value:o.value}, o.label); if(o.value===value) op.selected=true; s.append(op); }

function checkbox(checked,onChange,label){

    el("input",{type:"checkbox",onchange:e=>onChange(e.target.checked)}),
    el("span",null,label));
  if(checked) row.querySelector("input").checked=true;
  return row;
}
function optionalNumber(label, value, {onSet,onClear,fallback=0,min,max,step,unit,hint}){
  if(value==null){
    return field(label,
      el("button",{class:"set-btn",onclick:()=>onSet(fallback)}, "+ set"), hint, unit);
  }
  const ctrl=numberInput(value,onSet,{min,max,step});
  const f=field(label, ctrl, hint, unit);
  f.querySelector(".field-label").append(el("button",{class:"clear-btn",title:"Unset",onclick:onClear},"unset"));
  return f;
}
function optional(label, present, {onAdd,onClear,hint,child}){
  if(!present){
    return field(label, el("button",{class:"set-btn",onclick:onAdd},"+ set"), hint);
  }
  const f=field(label, child, hint);
  f.querySelector(".field-label").append(el("button",{class:"clear-btn",title:"Unset",onclick:onClear},"unset"));
  return f;
}
function dangerButton(text,onClick){ return el("button",{class:"danger",onclick:onClick}, text); }

/* lightweight combobox: input + filtered dropdown (native-feel, robust) */
function combo(value, options, onChange, placeholder, opts){
  opts=opts||{};
  const byVal=new Map(options.map(o=>[o.value,o]));
  const cur=byVal.get(value);
  const wrap=el("div",{class:"combo"});
  const input=el("input",{class:"field-input mono",type:"text",placeholder:placeholder||"",
    value: cur? (cur.label):""});
  const pop=el("div",{class:"combo-pop",style:{display:"none"}});
  wrap.append(input,pop);
  let active=-1, filtered=options;
  function render(q){
    pop.textContent="";
    const ql=(q||"").toLowerCase();
    filtered=options.filter(o=> ql===""|| (o.label||"").toLowerCase().includes(ql) || (o.value||"").toLowerCase().includes(ql));
    if(!filtered.length){ pop.append(el("div",{class:"combo-empty"},"no matches")); return; }
    filtered.slice(0,200).forEach((o,i)=>{
      const row=el("div",{class:"combo-opt"+(i===active?" active":"")},
        o.dot?el("span",{class:"dot",style:{background:o.dot}}):null,
        el("span",null,o.label),
        o.hint?el("span",{class:"leaf-id"},o.hint):null);
      row.addEventListener("pointerdown",ev=>{ ev.preventDefault(); pick(o); });
      pop.append(row);
    });
  }
  function open(){ render(""); pop.style.display=""; }
  function close(){ pop.style.display="none"; active=-1; }
  function pick(o){ onChange(o.value); if(opts.clearOnPick){ input.value=""; } else { input.value=o.label; } close(); input.blur(); }
  input.addEventListener("focus",()=>{ input.select?input.select():0; open(); });
  input.addEventListener("input",()=>{ active=-1; render(input.value); pop.style.display=""; });
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(filtered.length-1,active+1); render(input.value); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); render(input.value); }
    else if(e.key==="Enter"){ if(filtered[active]) { e.preventDefault(); pick(filtered[active]); } }
    else if(e.key==="Escape"){ close(); }
  });
  input.addEventListener("blur",()=>setTimeout(close,120));
  return wrap;
}
function itemOptions(items){ return items.map(i=>({value:i.id,label:(i.isTag?"# ":"")+(i.name||i.id),dot:i.isTag?"var(--ink-faint)":catColor(i.category)})); }

/* ---- MachineDef ---- */
const SOURCE_OPTS=[{value:"",label:"none"},{value:"electric",label:"electric"},{value:"liquid",label:"liquid"},{value:"fuel",label:"fuel"}];
const DIR_OPTS=[{value:"in",label:"in"},{value:"out",label:"out"}];
const UNIT_CAT={solid:"items",liquid:"mB",energy:"EU"};
function defInspector(body, def){
  const items=WORLD.items||[];
  body.append(field("id", idEditor("machineDef",def), "derived from the name; edit to rename everywhere"));
  body.append(field("name", textInput(def.name, v=>saveEntity("machineDef", v.trim()===""?withoutField(def,"name"):withField(def,"name",v)), "(unnamed)")));

  const source=def.energySource;
  const isConverter = def.outputItemId!=null || def.maxFluidRate!=null;
  const energyItems=items.filter(i=>i.category==="energy");
  const sourceItems = source==="fuel"? items.filter(i=>i.eu!=null) : source==="electric"? energyItems : items.filter(i=>i.category==="liquid");
  const outputItems=items.filter(i=>i.category==="liquid"||i.category==="energy");
  const outputCat=(BY.items[def.outputItemId]||{}).category;
  const outputUnit=outputCat==="energy"?"EU/t":outputCat==="liquid"?"mB/t":"/t";

  body.append(field("energy source", selectInput(source||"", SOURCE_OPTS, setSource), "how the machine is powered while it runs"));
  function setSource(next){
    let d={...def};
    ["energySource","sourceItemId","baseEnergyConsumption","outputItemId","efficiency","maxFluidRate","inputItemId","materialRatio"].forEach(k=>d=withoutField(d,k));
    if(next==="electric"){ d=withField(d,"energySource","electric"); d=withField(d,"baseEnergyConsumption",20); if(energyItems[0]) d=withField(d,"sourceItemId",energyItems[0].id); }
    else if(next==="liquid"||next==="fuel"){ d=withField(d,"energySource",next); d=withField(d,"baseEnergyConsumption",20); }
    saveEntity("machineDef", d);
  }

  if(source==="electric"){
    body.append(field("power carrier", combo(def.sourceItemId||"", itemOptions(energyItems), v=>saveEntity("machineDef",withField(def,"sourceItemId",v)), energyItems.length?"pick an energy item…":"create an energy item"), "routed over electric connections"));
    body.append(optionalNumber("default energy draw", def.baseEnergyConsumption!=null?toPerTick(def.baseEnergyConsumption):null, {
      onSet:v=>saveEntity("machineDef",withField(def,"baseEnergyConsumption",toPerSecond(v))),
      onClear:()=>saveEntity("machineDef",withoutField(def,"baseEnergyConsumption")),
      fallback:1,min:0,unit:"EU/t",hint:"fallback EU/t; a recipe's own energy overrides it"}));
    body.append(optional("voltage tier", def.voltageTier!=null, {
      onAdd:()=>saveEntity("machineDef",withField(def,"voltageTier","LV")),
      onClear:()=>saveEntity("machineDef",withoutField(def,"voltageTier")),
      hint:"power-tier label (LV / MV / HV …)",
      child:textInput(def.voltageTier, v=>saveEntity("machineDef",withField(def,"voltageTier",v)),"e.g. LV")}));
    body.append(optionalNumber("max draw", def.maxEuPerTick, {
      onSet:v=>saveEntity("machineDef",withField(def,"maxEuPerTick",v)),
      onClear:()=>saveEntity("machineDef",withoutField(def,"maxEuPerTick")),
      fallback:32,min:0,unit:"EU/t",hint:"ceiling — clamps overclock to what the tier can feed"}));
  }
  if(source==="liquid"||source==="fuel"){
    body.append(field(source==="fuel"?"fuel":"source liquid", combo(def.sourceItemId||"", itemOptions(sourceItems), v=>saveEntity("machineDef",withField(def,"sourceItemId",v)), sourceItems.length?"consumed for energy…":"no matching items")));
    body.append(field("converter", checkbox(isConverter, setConverter, "generates an output from its source")));
    function setConverter(on){
      let d={...def};
      if(on){ d=withoutField(d,"baseEnergyConsumption"); d=withField(d,"maxFluidRate",256); d=withField(d,"outputItemId",(outputItems[0]&&outputItems[0].id)||""); }
      else { ["maxFluidRate","outputItemId","efficiency","inputItemId","materialRatio"].forEach(k=>d=withoutField(d,k)); d=withField(d,"baseEnergyConsumption",20); }
      saveEntity("machineDef",d);
    }
    if(isConverter){
      body.append(field("material in", combo(def.inputItemId||"", [{value:"",label:"— none —"}].concat(itemOptions(items)), v=>saveEntity("machineDef", v?withField(def,"inputItemId",v):withoutField(def,"inputItemId")), "pick a material…"), "consumed and turned into the output; leave unset if the source itself is spent"));
      if(def.inputItemId) body.append(optionalNumber("output per material", def.materialRatio, {
        onSet:v=>saveEntity("machineDef",withField(def,"materialRatio",v)),
        onClear:()=>saveEntity("machineDef",withoutField(def,"materialRatio")),
        fallback:1,min:0,hint:"output units per unit of material; unset = 1:1"}));
      body.append(field("produces", combo(def.outputItemId||"", itemOptions(outputItems), v=>saveEntity("machineDef",withField(def,"outputItemId",v)), outputItems.length?"pick output…":"no liquid/energy items")));
      body.append(optionalNumber("output rate", def.maxFluidRate!=null?toPerTick(def.maxFluidRate):null, {
        onSet:v=>saveEntity("machineDef",withField(def,"maxFluidRate",toPerSecond(v))),
        onClear:()=>saveEntity("machineDef",withoutField(def,"maxFluidRate")),
        fallback:8,min:0,unit:outputUnit,hint:"how much output it makes per tick"}));
      body.append(optionalNumber("energy loss", def.efficiency, {
        onSet:v=>saveEntity("machineDef",withField(def,"efficiency",v)),
        onClear:()=>saveEntity("machineDef",withoutField(def,"efficiency")),
        min:0,max:1,step:0.05,hint:"fraction wasted below full load; 0 = lossless"}));
    } else {
      body.append(optionalNumber("energy draw", def.baseEnergyConsumption!=null?toPerTick(def.baseEnergyConsumption):null, {
        onSet:v=>saveEntity("machineDef",withField(def,"baseEnergyConsumption",toPerSecond(v))),
        onClear:()=>saveEntity("machineDef",withoutField(def,"baseEnergyConsumption")),
        fallback:1,min:0,unit:"EU/t",hint:"source consumed while running"}));
    }
  }

  // storage
  body.append(field("storage buffer", checkbox(def.storage!=null, on=>{
    if(on) saveEntity("machineDef", withField(def,"storage",{category:"solid",capacity:1600}));
    else saveEntity("machineDef", withoutField(def,"storage"));
  }, "this machine is a buffer")));
  if(def.storage){
    body.append(field("stores", selectInput(def.storage.category, CAT_OPTS, v=>saveEntity("machineDef",withField(def,"storage",{...def.storage,category:v})))));
    body.append(field("capacity", numberInput(def.storage.capacity, v=>saveEntity("machineDef",withField(def,"storage",{...def.storage,capacity:v})), {min:0}), "per unit; parallel count multiplies it", UNIT_CAT[def.storage.category]));
  }

  body.append(allowedRecipesEditor(def));
  body.append(slotListEditor(def));
  body.append(dangerButton("Delete machine def", ()=>deleteSelected()));
