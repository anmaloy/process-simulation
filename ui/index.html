/* ============================================================================
   Balance sheet — a resizable dock along the bottom of the stage
   ============================================================================
   The readout is a glance; a real chain touches hundreds of resources. The sheet
   lists all of them for the current scope (world / process / node / system), off
   the engine's per-resource ledger (REPORT.itemLedger):

   - Resources: made / used / net, need and capacity at 100% duty, production
     missing to run every user flat out, feedstock in, yield out, shortfall, maker
     and user counts, and a coverage bar. Sort by any column, search, filter by
     category and by state (limiting, under-supplied, imported, product,
     intermediate, balanced), hide columns, switch rates between /s, /min and /h. Click a row to
     expand who makes and who uses it (click one to select it on the canvas);
     hovering a row outlines its makers (solid) and users (dashed) on the canvas.
   - Machines: every machine's duty, run band, recipes, limiting inputs, products.
   - Bottlenecks: every limiting shortfall, ranked, with its share of the need.
   Copy (TSV) and CSV export take the current filtered view. State persists. */
const DOCK_DEFAULT = {
  open:false, tab:"resources", h:340, max:false, unit:"s",
  q:"", cats:["solid","liquid","energy"], view:"all", hidden:[],
  mq:"", mview:"all", bq:"",
  sort:{resources:{key:"short",dir:-1}, machines:{key:"duty",dir:1}, bottlenecks:{key:"short",dir:-1}},
};
let DOCK = loadDock();
const DOCK_OPEN_ROWS = new Set();     // expanded resource rows
let DOCK_STAMP = null;                // skip rebuilding an unchanged sheet
let DOCK_SHOWN_SEL = null;
const EPS = 1e-9;
function loadDock(){
  const d = structuredClone(DOCK_DEFAULT);
  try{
    const j = JSON.parse(localStorage.getItem("ps.dock")||"null");
    if(j && typeof j==="object"){ Object.assign(d, j); d.sort = {...DOCK_DEFAULT.sort, ...(j.sort||{})}; }
  }catch(e){}
  return d;
}
function saveDock(){ try{ localStorage.setItem("ps.dock", JSON.stringify(DOCK)); }catch(e){} }
function setDock(patch){ Object.assign(DOCK, patch); saveDock(); renderDock(true); }
// Open the sheet, optionally on a tab / filter, or scrolled to one resource.
function openDock({tab, view, focus}={}){
  const patch = {open:true};
  if(tab) patch.tab = tab;
  if(view){ patch.view = view; patch.q = ""; }
  if(focus){
    patch.tab = "resources"; patch.view = "all"; patch.q = "";
    const cat = ((REPORT&&REPORT.itemLedger&&REPORT.itemLedger[focus])||{}).category;
    if(cat && !DOCK.cats.includes(cat)) patch.cats = [...DOCK.cats, cat];
    DOCK_OPEN_ROWS.add(focus);
  }
  setDock(patch);
  if(focus){
    const row = $(`#dock tr.row[data-item="${cssEsc(focus)}"]`);
    if(row && row.scrollIntoView) row.scrollIntoView({block:"nearest"});
  }
}
function toggleDock(){ setDock({open:!DOCK.open}); }

/* ---- units: material rates per s / min / h; energy always EU/t (as elsewhere) */
const UNIT_MUL = {s:1, min:60, h:3600};
function unitLabel(cat){
  if(cat==="energy") return "EU/t";
  const per = "/"+DOCK.unit;
  return cat==="liquid"? "mB"+per : per;
}
function inUnit(cat, perSec){ return cat==="energy"? toPerTick(perSec) : perSec*UNIT_MUL[DOCK.unit]; }
function fmtCell(cat, perSec){
  if(perSec==null) return "—";
  const v = inUnit(cat, perSec);
  if(Math.abs(v) < 1e-9) return "·";
  const {v:val, s} = scaleMag(v);
  return (v<0&&!String(val).startsWith("-")?"−":"")+String(val).replace("-","−")+s;
}
function exportNum(cat, perSec){ return perSec==null? "" : String(clean(inUnit(cat, perSec))); }

/* ---- data ---- */
function nodeLabel(nid){ const n=BY.nodes[nid]; return (n && BY.defs[n.machineDefId] && BY.defs[n.machineDefId].name) || (n && n.machineDefId) || nid; }
function itemLabel(id){ const it=BY.items[id]; return (it && it.name) || id; }
function ledgerRows(){
  const L = (REPORT && REPORT.itemLedger) || {};
  return Object.values(L).map(r=>{
    const it = BY.items[r.itemId];
    const cat = r.category || (it && it.category) || "solid";
    const supply = r.capacity + r.feedstock;
    const missing = r.isTag ? 0 : Math.max(0, r.demand - supply);
    const cover = r.demand > EPS ? Math.min(1, (r.produced + r.feedstock) / r.demand) : null;
    const internal = r.producers.length>0 && r.consumers.length>0;
    const flags = [];
    if(r.shortfall > EPS) flags.push("short");
    if(missing > EPS) flags.push("under");
    if(r.feedstock > EPS) flags.push("in");
    if(r.yield > EPS) flags.push("out");
    return {...r, cat, name:itemLabel(r.itemId), tag:!!r.isTag, net:r.produced - r.consumed,
      missing, cover, internal, flags, makers:r.producers.length, users:r.consumers.length};
  });
}
// Two different questions, often confused:
// - limiting: at the solved operating point this resource is what pins at least
//   one machine's rate (its binding input; it has a shortfall, a bottleneck).
// - under-supplied: a capacity deficit — every maker at 100% plus feedstock can't
//   cover every user at 100%. Its users may still be held lower by something else
//   (power, another input), in which case it is under-supplied but not limiting.
const STATE_INFO = {
  short:["limiting","the binding input of at least one machine right now — it is what holds that machine's rate down (a bottleneck)"],
  under:["under-supplied","makers at 100% + feedstock can't cover users at 100% — a capacity deficit, whether or not it is what currently binds"],
  in:["imported","fed in across the scope boundary"],
  out:["product","leaves the scope as yield / surplus"],
};
const RES_VIEWS = [
  ["all","all", ()=>true],
  ["short","limiting", r=>r.shortfall>EPS],
  ["under","under-supplied", r=>r.missing>EPS],
  ["in","imported", r=>r.feedstock>EPS],
  ["out","products", r=>r.yield>EPS],
  ["mid","intermediates", r=>r.internal],
  ["ok","balanced", r=>r.shortfall<=EPS && r.missing<=EPS && r.feedstock<=EPS && r.yield<=EPS],
];
const RES_COLS = [
  {k:"name", h:"resource", l:true, get:r=>r.name.toLowerCase(), title:"click a row for its makers and users"},
  {k:"unit", h:"unit", l:true, get:r=>unitLabel(r.cat)},
  {k:"made", h:"made", get:r=>r.produced, title:"produced at the solved duty cycles"},
  {k:"used", h:"used", get:r=>r.consumed, title:"consumed at the solved duty cycles"},
  {k:"net", h:"net", get:r=>r.net, title:"made − used (feedstock covers a negative net, yield takes a positive one)"},
  {k:"need", h:"need @100%", get:r=>r.demand, title:"what every user would draw running flat out"},
  {k:"cap", h:"can make @100%", get:r=>r.capacity, title:"what every maker would produce running flat out"},
  {k:"missing", h:"missing", get:r=>r.missing, title:"production (or feedstock) missing to run every user at 100%"},
  {k:"in", h:"feedstock", get:r=>r.feedstock, title:"fed in across the scope boundary"},
  {k:"out", h:"yield", get:r=>r.yield, title:"leaves the scope (product / surplus)"},
  {k:"short", h:"shortfall", get:r=>r.shortfall, title:"what the machines it limits are missing of it (only where it is their binding input)"},
  {k:"makers", h:"makers", get:r=>r.makers},
  {k:"users", h:"users", get:r=>r.users},
  {k:"cover", h:"coverage", get:r=>r.cover==null?2:r.cover, title:"share of the full-rate need actually supplied"},
  {k:"state", h:"state", l:true, get:r=>r.flags.join(" "), title:"limiting · under-supplied · imported · product"},
];
function machineRows(){
  if(!REPORT) return [];
  const bals = REPORT.balances||{}, duty = REPORT.nodeDuty||{};
  return (REPORT.nodeIds||[]).map(nid=>{
    const n = BY.nodes[nid]||{}, b = bals[nid]||{inputs:{},outputs:{}};
    const limits = Object.values(b.inputs||{}).filter(x=>x.status==="shortfall").map(x=>x.itemId);
    const makes = Object.values(b.outputs||{}).filter(x=>x.rate>EPS).sort((a,c)=>c.rate-a.rate).map(x=>x.itemId);
    const recipes = nodeRecipeIds(n).map(id=>(BY.recipes[id]&&BY.recipes[id].name)||id);
    return {nid, name:nodeLabel(nid), recipes, duty:duty[nid]==null?1:duty[nid], status:b.status||"ok",
      limits, makes, uses:Object.keys(b.inputs||{})};
  });
}
const MACH_VIEWS = [["all","all",()=>true],["stalled","stalled",m=>m.status==="stalled"],["throttled","throttled",m=>m.status==="throttled"],["ok","full",m=>m.status==="ok"]];
const MACH_COLS = [
  {k:"name", h:"machine", l:true, get:m=>m.name.toLowerCase()},
  {k:"nid", h:"node", l:true, get:m=>m.nid},
  {k:"duty", h:"duty", get:m=>m.duty},
  {k:"status", h:"state", l:true, get:m=>({stalled:0,throttled:1,ok:2})[m.status]??3},
  {k:"recipes", h:"recipes", l:true, get:m=>m.recipes.join(", ").toLowerCase()},
  {k:"limits", h:"limited by", l:true, get:m=>m.limits.length},
  {k:"makes", h:"makes", l:true, get:m=>m.makes.length},
];
function bottleneckRows(){
  if(!REPORT) return [];
  const bals = REPORT.balances||{};
  return (REPORT.bottlenecks||[]).map((b,i)=>{
    const need = ((bals[b.nodeId]||{}).inputs||{})[b.itemId];
    const cat = (BY.items[b.itemId]||{}).category || "solid";
    return {rank:i+1, nid:b.nodeId, name:nodeLabel(b.nodeId), item:b.itemId, itemName:itemLabel(b.itemId), cat,
      short:b.shortfall, need:need?need.demand:null, pct:need&&need.demand>EPS? b.shortfall/need.demand : null};
  });
}
const BN_COLS = [
  {k:"rank", h:"#", get:b=>b.rank},
  {k:"name", h:"machine", l:true, get:b=>b.name.toLowerCase()},
  {k:"nid", h:"node", l:true, get:b=>b.nid},
  {k:"itemName", h:"short of", l:true, get:b=>b.itemName.toLowerCase()},
  {k:"short", h:"short", get:b=>b.short},
  {k:"need", h:"need", get:b=>b.need==null?-1:b.need},
  {k:"pct", h:"% of need", get:b=>b.pct==null?-1:b.pct},
];
function sortRows(rows, cols, tab){
  const st = DOCK.sort[tab] || {}; const col = cols.find(c=>c.k===st.key) || cols[0]; const dir = st.dir || 1;
  return rows.slice().sort((a,b)=>{
    const x=col.get(a), y=col.get(b);
    const c = (typeof x==="number" && typeof y==="number")? x-y : cmp(String(x),String(y));
    return c*dir || cmp(a.name||"", b.name||"");
  });
}
function sortBy(tab, key, cols){
  const cur = DOCK.sort[tab] || {};
  const col = cols.find(c=>c.k===key);
  const dir = cur.key===key ? -cur.dir : (col&&col.l ? 1 : -1);   // numbers: largest first
  setDock({sort:{...DOCK.sort, [tab]:{key, dir}}});
}
function filteredResources(){
  const q = DOCK.q.trim().toLowerCase();
  const view = (RES_VIEWS.find(v=>v[0]===DOCK.view)||RES_VIEWS[0])[2];
  const all = ledgerRows();
  const base = all.filter(r=>DOCK.cats.includes(r.cat) && (!q || r.name.toLowerCase().includes(q) || r.itemId.toLowerCase().includes(q)));
  return {all, base, rows: sortRows(base.filter(view), RES_COLS, "resources")};
}
function filteredMachines(){
  const q = DOCK.mq.trim().toLowerCase();
  const view = (MACH_VIEWS.find(v=>v[0]===DOCK.mview)||MACH_VIEWS[0])[2];
  const hit = m => !q || m.name.toLowerCase().includes(q) || m.nid.toLowerCase().includes(q)
    || m.recipes.some(r=>r.toLowerCase().includes(q)) || m.makes.concat(m.uses).some(i=>itemLabel(i).toLowerCase().includes(q)||i.includes(q));
  const all = machineRows(); const base = all.filter(hit);
  return {all, base, rows: sortRows(base.filter(view), MACH_COLS, "machines")};
}
function filteredBottlenecks(){
  const q = DOCK.bq.trim().toLowerCase();
  const all = bottleneckRows();
  const base = all.filter(b=>!q || b.name.toLowerCase().includes(q) || b.nid.includes(q) || b.itemName.toLowerCase().includes(q) || b.item.includes(q));
  return {all, base, rows: sortRows(base, BN_COLS, "bottlenecks")};
}

/* ---- canvas highlight while hovering a resource ---- */
function highlightNodes(makers, users){
  const vp=$("#viewport"); if(!vp) return;
  const mk=new Set(makers||[]), us=new Set(users||[]), any=mk.size||us.size;
  vp.querySelectorAll(".node").forEach(d=>{
    const id=d.getAttribute("data-id");
    d.classList.toggle("hl-make", mk.has(id));
    d.classList.toggle("hl-use", !mk.has(id) && us.has(id));
    d.classList.toggle("hl-dim", !!any && !mk.has(id) && !us.has(id));
  });
}
// Fit the canvas around a set of nodes (a resource's makers and users).
function frameNodes(ids){
  const pts = ids.map(id=>BY.nodes[id]).filter(n=>n && n.x!=null && n.y!=null);
  if(!pts.length) return;
  const vb=viewportBox();
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const n of pts){ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+NODE_W); maxY=Math.max(maxY,n.y+140); }
  const visH = vb.h - (DOCK.open ? dockHeight() : 0);
  const w=maxX-minX, h=maxY-minY;
  const k=Math.min(1.5, Math.max(0.2, Math.min(vb.w*0.8/w, visH*0.8/h)));
  view={k, x: vb.cx-(minX+w/2)*k, y: visH/2-(minY+h/2)*k};
  applyView();
}

/* ---- export ---- */
function sheetTable(){
  if(DOCK.tab==="machines"){
    const {rows}=filteredMachines();
    return [["machine","node","duty %","state","recipes","limited by","makes"],
      ...rows.map(m=>[m.name,m.nid,String(clean(m.duty*100)),m.status,m.recipes.join("; "),m.limits.map(itemLabel).join("; "),m.makes.map(itemLabel).join("; ")])];
  }
  if(DOCK.tab==="bottlenecks"){
    const {rows}=filteredBottlenecks();
    return [["rank","machine","node","short of","unit","short","need","% of need"],
      ...rows.map(b=>[String(b.rank),b.name,b.nid,b.itemName,unitLabel(b.cat),exportNum(b.cat,b.short),exportNum(b.cat,b.need),b.pct==null?"":String(clean(b.pct*100))])];
  }
  const {rows}=filteredResources();
  return [["resource","id","category","unit","made","used","net","need @100%","can make @100%","missing","feedstock","yield","shortfall","makers","users","coverage %","state"],
    ...rows.map(r=>[r.name,r.itemId,r.cat,unitLabel(r.cat),exportNum(r.cat,r.produced),exportNum(r.cat,r.consumed),exportNum(r.cat,r.net),
      exportNum(r.cat,r.demand),exportNum(r.cat,r.capacity),exportNum(r.cat,r.missing),exportNum(r.cat,r.feedstock),exportNum(r.cat,r.yield),
      exportNum(r.cat,r.shortfall),String(r.makers),String(r.users),r.cover==null?"":String(clean(r.cover*100)),r.flags.map(f=>STATE_INFO[f][0]).join("; ")])];
}
async function copySheet(){
  const text = sheetTable().map(r=>r.map(c=>String(c).replace(/[\t\n]/g," ")).join("\t")).join("\n");
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}
  if(!ok){
    const ta=el("textarea",{style:{position:"fixed",left:"-9999px"}}); ta.value=text; document.body.append(ta); ta.select();
    try{ ok=document.execCommand("copy"); }catch(e){} ta.remove();
  }
  toast(ok? `copied ${text.split("\n").length-1} rows — paste into a spreadsheet` : "copy failed", !ok);
}
function downloadCsv(){
  const csv = sheetTable().map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }).join(",")).join("\n");
  const a=el("a",{href:URL.createObjectURL(new Blob([csv],{type:"text/csv"})), download:`balance-${DOCK.tab}-${SCOPE}.csv`});
  document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- rendering ---- */
function dockHeight(){
  const stage=$("#stage"); const max = stage? stage.clientHeight - 40 : 600;
  return DOCK.max ? max : Math.max(150, Math.min(max, DOCK.h));
}
function scopeLabel(){
  if(SCOPE==="world") return "whole world";
  if(SCOPE==="system") return "system · "+((BY.systems[SYSTEM_ID]||{}).name||SYSTEM_ID||"—");
  const id = SEL&&SEL.kind==="node"? SEL.id : null;
  return SCOPE+" · "+(id? nodeLabel(id)+" "+id : "select a machine");
}
function renderDock(force){
  const dock=$("#dock"); if(!dock) return;
  const selKey = SEL? SEL.kind+":"+SEL.id : "";
  const stamp = [REPORT, STALE, selKey, JSON.stringify(DOCK), SCOPE, DOCK_OPEN_ROWS.size];
  if(!force && DOCK_STAMP && stamp.every((x,i)=>x===DOCK_STAMP[i])) return;
  DOCK_STAMP = stamp;
  preserving(dock, ()=>buildDock(dock));
  const stage=$("#stage");
  if(stage) stage.style.setProperty("--dock-h", dock.offsetHeight+"px");
  // A resource selected elsewhere (library, inspector) scrolls into view here.
  if(DOCK.open && DOCK.tab==="resources" && SEL && SEL.kind==="item" && DOCK_SHOWN_SEL!==selKey){
    const row=dock.querySelector(`tr.row[data-item="${cssEsc(SEL.id)}"]`);
    if(row && row.scrollIntoView) row.scrollIntoView({block:"nearest"});
  }
  DOCK_SHOWN_SEL = selKey;
}
function buildDock(dock){
  dock.textContent="";

/* save an entity edit + optional rename */
// An inspector edit hands over the whole entity it built from what it rendered.
// Only the fields it actually changed are sent: they are diffed against the entity
// as rendered and re-applied onto the entity as it stands when the queued edit runs,
// so a second edit made before the first returned can't overwrite it.
function saveEntity(kind, entity){
  const base = findEntity(kind, entity.id);
  if(!base) return applyEdits([upsert(kind, entity)]);
  const patch = diffPatch(base, entity);
  if(!patch.length) return Promise.resolve();
  return applyEdits(()=>{
    const latest = findEntity(kind, entity.id);
    return [upsert(kind, latest? applyPatch(latest, patch) : entity)];
  });
}
function renameAndSave(kind, oldId, rawId){
  const newId = rawId==null? "" : slugify(rawId);
  if(!String(rawId||"").trim()){ toast("id is required",true); return false; }
  if(oldId===newId) return true;
  const taken=idsOfKind(kind); if(taken.has(newId)){ toast(`id "${newId}" already exists`,true); return false; }
  replaceWorld(()=>{
    if(SEL&&SEL.kind===kind&&SEL.id===oldId){
      SEL={kind,id:newId};
      const insp=$("#inspector"); if(insp) insp.dataset.sel=kind+":"+newId;   // same entity: keep scroll
    }
    return renameEntity(WORLD, kind, oldId, newId);
  });
  return true;
}

function field(label, control, hint, unit){
  const f=el("div",{class:"field","data-fk":label});
  f.append(el("span",{class:"field-label mono"}, label, unit?el("span",{class:"field-unit"},unit):null, typeof control==="object"&&control._labelExtra?control._labelExtra:null));
  f.append(control);

}
// Inspector inputs commit on blur / Enter, not per keystroke: a keystroke that
// saved would rebuild the inspector under the user mid-word. A commit happens only
// when the text differs from what was rendered (defaultValue); Escape reverts the
// field and leaves it. A commit callback returning false rejects the text: the
// field reverts, flashes invalid, and the reason is toasted. (Live filter boxes —
// the rail search, combobox queries — keep their own oninput handlers.)
function bindCommit(inp, commit){
  const doCommit=()=>{
    if(RENDERING) return;                       // torn down by a re-render, not left by the user
    if(inp.value===inp.defaultValue) return;
    const ok=commit(inp.value);
    if(ok===false){ inp.value=inp.defaultValue; flagInvalid(inp); }
    else inp.defaultValue=inp.value;            // committed: blur after Enter is a no-op
  };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter" && inp.tagName!=="TEXTAREA"){ e.preventDefault(); doCommit(); }
    else if(e.key==="Escape"){ e.stopPropagation(); inp.value=inp.defaultValue; inp.blur(); }
  });
  inp.addEventListener("blur",doCommit);
  return inp;
}
function flagInvalid(inp){
  inp.classList.remove("invalid"); void inp.offsetWidth; inp.classList.add("invalid");
  setTimeout(()=>inp.classList.remove("invalid"), 1600);
}
function textInput(value,onChange,placeholder,{required=false,label="value"}={}){
  const inp=el("input",{class:"field-input",type:"text",value:value||"",placeholder:placeholder||""});
  return bindCommit(inp, raw=>{
    if(required && raw.trim()===""){ toast(label+" is required",true); return false; }
    return onChange(raw);
  });
}
// Numbers render as clean decimals: unit conversions (EU/s ↔ EU/t) must not leak
// float noise like 1.1000000000000003 into a field.
const clean = v => (typeof v==="number" && Number.isFinite(v))? Number(v.toPrecision(12)) : v;
const fmtNum = v => v==null||v===""? "" : String(clean(Number(v)));
function parseNumber(raw){
  let s=String(raw).trim().replace(/[\s_]/g,"");
  if(s==="") return {empty:true};
  if(/^[-+]?\d*,\d+$/.test(s)) s=s.replace(",",".");    // a decimal comma (1,5)
  const n=Number(s);
  if(!Number.isFinite(n) || /^[-+]?$/.test(s)) return {error:`"${String(raw).trim()}" is not a number`};
  return {value:n};
}
// Numeric fields are text inputs parsed here, not <input type=number>: a number
// input reports "" for partial entries such as "0." or "-", silently steps its value
// under the mouse wheel, ignores min/max on typed values, and rejects a decimal
// comma. Rules: `min`/`max` inclusive, `gt` exclusive lower bound, `integer`, and
// emptiness → `onClear` (optional field: unset) or rejection ("required").
function numberInput(value,onChange,opts){
  opts=opts||{};
  const inp=el("input",{class:"field-input num",type:"text",value:fmtNum(value),
    inputmode:(opts.min!=null&&opts.min>=0)||opts.gt!=null? "decimal" : "text",
    spellcheck:"false", autocomplete:"off", placeholder:opts.placeholder||""});
  const check=v=>{
    if(opts.integer && !Number.isInteger(v)) return "must be a whole number";
    if(opts.gt!=null && !(v>opts.gt)) return "must be greater than "+opts.gt;
    if(opts.min!=null && v<opts.min) return "must be at least "+opts.min;
    if(opts.max!=null && v>opts.max) return "must be at most "+opts.max;
    return null;
  };
  // ArrowUp / ArrowDown step the value like a spinner (committed on blur / Enter).
  inp.addEventListener("keydown",e=>{
    if(e.key!=="ArrowUp" && e.key!=="ArrowDown") return;
    e.preventDefault();
    const p=parseNumber(inp.value); const step=Number(opts.step)||1;
    let v=(p.value!=null? p.value : 0) + (e.key==="ArrowUp"? step : -step);
    if(opts.min!=null) v=Math.max(opts.min, v);
    if(opts.max!=null) v=Math.min(opts.max, v);
    inp.value=fmtNum(v);
  });
  return bindCommit(inp, raw=>{
    const p=parseNumber(raw);
    const what=opts.label||"value";
    if(p.empty){
      if(opts.onClear){ opts.onClear(); return; }
      toast(what+" is required",true); return false;
    }
    if(p.error){ toast(p.error,true); return false; }
    const bad=check(p.value);
    if(bad){ toast(what+" "+bad,true); return false; }
    onChange(clean(p.value));
  });
}
function selectInput(value,options,onChange){
  const s=el("select",{class:"field-input",onchange:e=>onChange(e.target.value)});
  for(const o of options){ const op=el("option",{value:o.value}, o.label); if(o.value===value) op.selected=true; s.append(op); }
  return s;
}
function checkbox(checked,onChange,label){
  const row=el("label",{class:"checkrow"},
    el("input",{type:"checkbox",onchange:e=>onChange(e.target.checked)}),
    el("span",null,label));
  if(checked) row.querySelector("input").checked=true;
  return row;
}
function optionalNumber(label, value, {onSet,onClear,fallback=0,min,max,gt,integer,step,unit,hint}){
  if(value==null){
    return field(label,
      el("button",{class:"set-btn",onclick:()=>onSet(fallback)}, "+ set"), hint, unit);
  }
  // Optional: clearing the field unsets it (same as the "unset" button).
  const ctrl=numberInput(value,onSet,{min,max,gt,integer,step,onClear,label});
  const f=field(label, ctrl, hint, unit);
  f.querySelector(".field-label").append(el("button",{class:"clear-btn",title:"Unset",onclick:onClear},"unset"));
  return f;
}
function optional(label, present, {onAdd,onClear,hint,child}){
  if(!present){
    return field(label, el("button",{class:"set-btn",onclick:onAdd},"+ set"), hint);
  }
  const f=field(label, child, hint);
  f.querySelector(".field-label").append(el("button",{class:"clear-btn",title:"Unset",onclick:onClear},"unset"));
  return f;
}
function dangerButton(text,onClick){ return el("button",{class:"danger",onclick:onClick}, text); }

/* lightweight combobox: input + filtered dropdown (native-feel, robust) */
function combo(value, options, onChange, placeholder, opts){
  opts=opts||{};
  const byVal=new Map(options.map(o=>[o.value,o]));
  const cur=byVal.get(value);
  // keyed by its placeholder so focus finds it again after chips are added above it
  const wrap=el("div",{class:"combo","data-fk":"combo:"+(opts.key||placeholder||"")});
  const shown = cur? cur.label : (value? String(value) : "");
  const input=el("input",{class:"field-input mono",type:"text",placeholder:placeholder||"",
    value: shown, spellcheck:"false", autocomplete:"off"});
  input._comboInput=true;
  const pop=el("div",{class:"combo-pop",style:{display:"none"},"data-sk":"combo"});
  wrap.append(input,pop);
  let active=-1, filtered=options, picked=false;
  function render(q){
    pop.textContent="";
    const ql=(q||"").toLowerCase();
    filtered=options.filter(o=> ql===""|| (o.label||"").toLowerCase().includes(ql) || (o.value||"").toLowerCase().includes(ql));
    if(!filtered.length){ pop.append(el("div",{class:"combo-empty"},"no matches")); return; }
    filtered.slice(0,200).forEach((o,i)=>{
      const row=el("div",{class:"combo-opt"+(i===active?" active":"")},
        o.dot?el("span",{class:"dot",style:{background:o.dot}}):null,
        el("span",null,o.label),
        o.hint?el("span",{class:"leaf-id"},o.hint):null);
      row.addEventListener("pointerdown",ev=>{ ev.preventDefault(); pick(o); });
      pop.append(row);
    });
  }
  const isOpen=()=>pop.style.display!=="none";
  // Open downward unless that would run off the bottom of the panel/window the
  // combobox sits in (it was clipped below the inspector's last field) — then up.
  function place(){
    pop.classList.remove("up");
    let clip=window.innerHeight, top=0;
    for(let a=wrap.parentElement; a; a=a.parentElement){
      const o=getComputedStyle(a).overflowY;
      if(o==="auto"||o==="scroll"||o==="hidden"){ const r=a.getBoundingClientRect(); clip=Math.min(clip,r.bottom); top=Math.max(top,r.top); break; }
    }
    const r=input.getBoundingClientRect(), need=Math.min(240, pop.scrollHeight||240);
    if(clip-r.bottom < need+6 && r.top-top > clip-r.bottom) pop.classList.add("up");
  }
  function open(){ render(""); pop.style.display=""; place(); }
  function close(){ pop.style.display="none"; active=-1; }
  // The field always shows the current value's label unless a pick was made: text
  // typed to search and then abandoned must not linger as if it were the value.
  function revert(){ input.value=shown; input.defaultValue=shown; }
  function pick(o){
    picked=true;
    if(opts.clearOnPick){ input.value=""; } else { input.value=o.label; }
    input.defaultValue=input.value;
    close();
    // An "add another" combobox (members, allowed recipes, the palette) keeps the
    // caret so the next one can be typed straight away; a value picker is done.
    if(!opts.clearOnPick) input.blur();
    onChange(o.value);
  }
  function scrollActive(){ const a=pop.querySelector(".combo-opt.active"); if(a&&a.scrollIntoView) a.scrollIntoView({block:"nearest"}); }
  input.addEventListener("focus",()=>{
    if(input._restoring) return;           // focus restored after a re-render: stay closed
    picked=false; try{ input.select(); }catch(e){} open();
  });
  input.addEventListener("input",()=>{ picked=false; active=-1; render(input.value); if(!isOpen()){ pop.style.display=""; place(); } });
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); if(!isOpen()){ open(); } active=Math.min(Math.min(filtered.length,200)-1,active+1); render(input.value); scrollActive(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); render(input.value); scrollActive(); }
    else if(e.key==="Enter"){
      e.preventDefault();
      // Enter takes the highlighted option, else the first match of what was typed.
      const o = filtered[active] || (input.value.trim() && filtered.length? filtered[0] : null);
      if(o && isOpen()) pick(o);
    }
    else if(e.key==="Escape"){
      // Escape belongs to the combobox: close the list / abandon the search, never
      // close the inspector behind it.
      e.stopPropagation(); e.preventDefault();
      if(isOpen()){ close(); revert(); } else { revert(); input.blur(); }
    }
    else if(e.key==="Tab"){ close(); }
  });
  input.addEventListener("blur",()=>setTimeout(()=>{
    if(RENDERING) return;
    close(); if(!picked) revert();
  },120));
  return wrap;
}
function itemOptions(items){ return items.map(i=>({value:i.id,label:(i.isTag?"# ":"")+(i.name||i.id),dot:i.isTag?"var(--ink-faint)":catColor(i.category)})); }

/* ---- id editor (rename) ---- */
function idEditor(kind, entity){
  const wrap=el("div",{class:"inline-row"});
  const inp=el("input",{class:"field-input mono",type:"text",value:entity.id,spellcheck:"false",autocomplete:"off"});
  // Enter renames; leaving the field without pressing Enter / the button keeps the
  // old id (a rename rewrites references everywhere, so it is never implicit).
  const go=()=>{ if(renameAndSave(kind, entity.id, inp.value)===false){ inp.value=entity.id; flagInvalid(inp); } };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); go(); }
    else if(e.key==="Escape"){ e.stopPropagation(); inp.value=entity.id; inp.blur(); }
  });
  const btn=el("button",{class:"tool-btn",title:"Rename id everywhere",onclick:go},"↻ name");
  wrap.append(inp,btn);
  return wrap;
}

/* ---- Item ---- */
const CAT_OPTS=[{value:"solid",label:"solid"},{value:"liquid",label:"liquid"},{value:"energy",label:"energy"}];
function itemInspector(body, it){
  body.append(field("id", idEditor("item",it), "derived from the name; edit to rename everywhere"));
  body.append(field("name", textInput(it.name, v=>saveEntity("item", withField(it,"name",v.trim())), "", {required:true,label:"name"})));
  body.append(field("category", selectInput(it.category, CAT_OPTS, v=>saveEntity("item", withField(it,"category",v)))));
  body.append(optional("fuel energy (eu)", it.eu!=null, {
    onAdd:()=>saveEntity("item", withField(it,"eu",1000)),
    onClear:()=>saveEntity("item", withoutField(it,"eu")),
    hint:"stored EU per unit; set only for fuels",
    child:numberInput(it.eu, v=>saveEntity("item", withField(it,"eu",v)), {min:0,label:"fuel energy",onClear:()=>saveEntity("item", withoutField(it,"eu"))})
  }));
  body.append(optional("tag resource", !!it.isTag, {
    onAdd:()=>saveEntity("item", withField(it,"isTag",true)),
    onClear:()=>saveEntity("item", withoutField(withoutField(it,"isTag"),"members")),
    hint:"a group ('any item in this set'), e.g. c:ingots/iron",
    child: tagMembersEditor(it)
  }));
  body.append(dangerButton("Delete item", ()=>deleteSelected()));
}
// A chip list that can hold hundreds of entries (allowed recipes, tag members,
// system members). Up to CHIPSET_FOLD it is plain chips; past that it gets a count,
// a filter, a "remove shown" action, and the chips sit in a capped scroll box
// (its scroll survives re-renders via data-sk) — so a long list never pushes the
// rest of the inspector off-screen. The filter text outlives the re-render a
// removal causes (CHIPSET_STATE), so pruning a filtered set is one click per chip.
const CHIPSET_STATE = new Map();
const CHIPSET_FOLD = 10;
function chipSet({key, ids, nameOf, onRemove, onRemoveMany, noun="entries"}){
  const wrap=el("div",{class:"chipset","data-fk":"chipset:"+key});
  if(!ids.length) return wrap;
  const chip=id=>el("span",{class:"chip mono",title:nameOf(id)===id?id:nameOf(id)+"\n"+id},
    el("span",null,nameOf(id)),
    el("button",{class:"chip-x",title:"remove",onclick:()=>onRemove(id)},"×"));
  if(ids.length<=CHIPSET_FOLD){ wrap.append(el("div",{class:"chip-list"}, ids.map(chip))); return wrap; }
  let st=CHIPSET_STATE.get(key); if(!st){ st={q:""}; CHIPSET_STATE.set(key,st); }
  const q=el("input",{class:"field-input mono",type:"text",placeholder:`filter ${ids.length} ${noun}…`,value:st.q,spellcheck:"false",autocomplete:"off"});
  const n=el("span",{class:"chipset-n"});
  const rm=el("button",{class:"mini-btn danger-ish"});
  const box=el("div",{class:"chipset-box","data-sk":"chipset:"+key});
  let shown=ids;
  function paint(){
    const ql=st.q.trim().toLowerCase();
    shown = ql? ids.filter(id=>nameOf(id).toLowerCase().includes(ql)||id.toLowerCase().includes(ql)) : ids;
    n.textContent = ql? `${shown.length} / ${ids.length}` : `${ids.length}`;
    rm.textContent = ql? `remove ${shown.length} shown` : "remove all";
    rm.disabled = !shown.length;
    box.textContent="";
    box.append(shown.length? el("div",{class:"chip-list"}, shown.map(chip)) : el("span",{class:"stack-empty mono"},"no matches"));
  }
  rm.addEventListener("click",()=>{ if(shown.length) (onRemoveMany? onRemoveMany(shown.slice()) : shown.forEach(onRemove)); });
  q.addEventListener("input",()=>{ st.q=q.value; paint(); });
  q.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); if(q.value){ q.value=""; st.q=""; paint(); } else q.blur(); } });
  paint();
  wrap.append(el("div",{class:"chipset-head"}, q, n, rm), box);
  return wrap;
}
function tagMembersEditor(it){
  const wrap=el("div");
  const members=it.members||[];
  const drop=rm=>{ const r=new Set(rm); saveEntity("item", withField(it,"members",members.filter(x=>!r.has(x)))); };
  wrap.append(chipSet({key:"members:"+it.id, ids:members, noun:"members",
    nameOf:m=>(BY.items[m]&&BY.items[m].name)||m, onRemove:m=>drop([m]), onRemoveMany:drop}));
  const addable=(WORLD.items||[]).filter(x=>x.id!==it.id&&!x.isTag&&!members.includes(x.id));
  wrap.append(combo("", itemOptions(addable), id=>saveEntity("item", withField(it,"members",[...members,id])), "+ add member…",{clearOnPick:true}));
  return wrap;
}

/* ---- Recipe ---- */
function recipeInspector(body, r){
  body.append(field("id", idEditor("recipe",r), "derived from the name"));
  body.append(field("name", textInput(r.name, v=>saveEntity("recipe", v.trim()===""?withoutField(r,"name"):withField(r,"name",v)), "(unnamed)")));
  body.append(field("cycle time", numberInput(r.timeSeconds, v=>saveEntity("recipe", withField(r,"timeSeconds",v)), {gt:0,step:0.05,label:"cycle time"}), null, "s"));
  body.append(optionalNumber("energy draw", r.euPerTick, {
    onSet:v=>saveEntity("recipe", withField(r,"euPerTick",v)),
    onClear:()=>saveEntity("recipe", withoutField(r,"euPerTick")),
    fallback:2, min:0, unit:"EU/t", hint:"overrides the machine's default draw while making this"}));
  // machineType is a grouping label, not engine input: machine defs list the
  // recipes they run (allowedRecipeIds), and the type lets a def allow a whole
  // kind at once. Suggest the types already in the world so one isn't misspelled.
  const typeList=el("datalist",{id:"dl-machine-types"}, [...recipesByMachineType().keys()].map(t=>el("option",{value:t})));
  const typeInput=textInput(r.machineType, v=>saveEntity("recipe", v.trim()===""?withoutField(r,"machineType"):withField(r,"machineType",v.trim())), "e.g. macerator");
  typeInput.setAttribute("list","dl-machine-types");
  body.append(optional("machine type", r.machineType!=null, {
    onAdd:()=>saveEntity("recipe", withField(r,"machineType","")),
    onClear:()=>saveEntity("recipe", withoutField(r,"machineType")),
    hint:"groups recipes by the machine kind that runs them — a machine def can allow every recipe of a type at once. Does not change the balance.",
    child:el("div",null, typeInput, typeList)}));
  // Which machines can run it is set on the machine def (allowed recipes).
  const runBy=(WORLD.machineDefs||[]).filter(d=>(d.allowedRecipeIds||[]).includes(r.id));
  body.append(field("run by", runBy.length
    ? el("div",{class:"chip-list"}, runBy.map(d=>el("button",{class:"chip mono",title:"open this machine def",onclick:()=>select("machineDef",d.id)}, d.name||d.id)))
    : el("span",{class:"static-val dim mono"},"any machine def with no allow-list"),
    "machine defs whose allowed recipes include this one"));
  body.append(stackListEditor("inputs", r, "inputs"));
  body.append(stackListEditor("outputs", r, "outputs"));
  body.append(dangerButton("Delete recipe", ()=>deleteSelected()));
}
function stackListEditor(label, r, key){
  const rows=r[key]||[];
  const f=el("div",{class:"field"});
  f.append(el("span",{class:"field-label mono"}, label));
  if(!rows.length) f.append(el("span",{class:"stack-empty mono"},"none"));
  const setRows=next=>saveEntity("recipe", withField(r,key,next));
  rows.forEach((s,i)=>{
    const resId=s.itemId!=null?s.itemId:(s.tag!=null?s.tag:"");
    const row=el("div",{class:"slot-group","data-fk":key+"["+i+"]"});
    row.append(el("div",{class:"slot-row"},
      combo(resId, itemOptions(WORLD.items||[]), id=>{
        const it=BY.items[id];
        const ns={...s}; delete ns.itemId; delete ns.tag;
        if(it&&it.isTag) ns.tag=id; else ns.itemId=id;
        setRows(rows.map((x,j)=>j===i?ns:x));
      }, "resource…"),
      el("button",{class:"row-del",onclick:()=>setRows(rows.filter((_,j)=>j!==i))},"×")));
    row.append(el("div",{class:"slot-row"},
      el("span",{class:"slot-x mono"},"qty"),
      numberInput(s.quantity, v=>setRows(rows.map((x,j)=>j===i?{...x,quantity:v}:x)), {gt:0,step:1,label:"quantity"}),
      el("span",{class:"slot-x mono",title:"chance per cycle, 0–1; blank = always (0 = catalyst, not consumed)"},"prob"),
      numberInput(s.probability, v=>setRows(rows.map((x,j)=>j===i?{...x,probability:v}:x)),
        {min:0,max:1,step:0.05,label:"probability",placeholder:"always",
         onClear:()=>setRows(rows.map((x,j)=>j===i?withoutField(x,"probability"):x))})));
    f.append(row);
  });
  f.append(el("button",{class:"row-add",onclick:()=>{
    const first=WORLD.items&&WORLD.items[0];
    if(!first){ toast("create an item first",true); return; }
    setRows([...rows,{itemId:first.id,quantity:1}]);
  }}, "+ add "+label.replace(/s$/,"")));
  return f;
}

/* ---- MachineDef ---- */
const SOURCE_OPTS=[{value:"",label:"none"},{value:"electric",label:"electric"},{value:"liquid",label:"liquid"},{value:"fuel",label:"fuel"}];
const DIR_OPTS=[{value:"in",label:"in"},{value:"out",label:"out"}];
const UNIT_CAT={solid:"items",liquid:"mB",energy:"EU"};
function defInspector(body, def){
  const items=WORLD.items||[];
  body.append(field("id", idEditor("machineDef",def), "derived from the name; edit to rename everywhere"));
  body.append(field("name", textInput(def.name, v=>saveEntity("machineDef", v.trim()===""?withoutField(def,"name"):withField(def,"name",v)), "(unnamed)")));

  const source=def.energySource;
  const isConverter = def.outputItemId!=null || def.maxFluidRate!=null;
  const energyItems=items.filter(i=>i.category==="energy");
  const sourceItems = source==="fuel"? items.filter(i=>i.eu!=null) : source==="electric"? energyItems : items.filter(i=>i.category==="liquid");
  const outputItems=items.filter(i=>i.category==="liquid"||i.category==="energy");
  const outputCat=(BY.items[def.outputItemId]||{}).category;
  const outputUnit=outputCat==="energy"?"EU/t":outputCat==="liquid"?"mB/t":"/t";

  body.append(field("energy source", selectInput(source||"", SOURCE_OPTS, setSource), "how the machine is powered while it runs"));
  function setSource(next){
    let d={...def};
    ["energySource","sourceItemId","baseEnergyConsumption","outputItemId","efficiency","maxFluidRate","inputItemId","materialRatio"].forEach(k=>d=withoutField(d,k));
    if(next==="electric"){ d=withField(d,"energySource","electric"); d=withField(d,"baseEnergyConsumption",20); if(energyItems[0]) d=withField(d,"sourceItemId",energyItems[0].id); }
    else if(next==="liquid"||next==="fuel"){ d=withField(d,"energySource",next); d=withField(d,"baseEnergyConsumption",20); }
    saveEntity("machineDef", d);
  }

  if(source==="electric"){
    body.append(field("power carrier", combo(def.sourceItemId||"", itemOptions(energyItems), v=>saveEntity("machineDef",withField(def,"sourceItemId",v)), energyItems.length?"pick an energy item…":"create an energy item"), "routed over electric connections"));
    body.append(optionalNumber("default energy draw", def.baseEnergyConsumption!=null?toPerTick(def.baseEnergyConsumption):null, {
      onSet:v=>saveEntity("machineDef",withField(def,"baseEnergyConsumption",toPerSecond(v))),
      onClear:()=>saveEntity("machineDef",withoutField(def,"baseEnergyConsumption")),
      fallback:1,min:0,unit:"EU/t",hint:"fallback EU/t; a recipe's own energy overrides it"}));
    body.append(optional("voltage tier", def.voltageTier!=null, {
      onAdd:()=>saveEntity("machineDef",withField(def,"voltageTier","LV")),
      onClear:()=>saveEntity("machineDef",withoutField(def,"voltageTier")),
      hint:"power-tier label (LV / MV / HV …)",
      child:textInput(def.voltageTier, v=>saveEntity("machineDef",withField(def,"voltageTier",v)),"e.g. LV")}));
    body.append(optionalNumber("max draw", def.maxEuPerTick, {
      onSet:v=>saveEntity("machineDef",withField(def,"maxEuPerTick",v)),
      onClear:()=>saveEntity("machineDef",withoutField(def,"maxEuPerTick")),
      fallback:32,gt:0,unit:"EU/t",hint:"ceiling — clamps overclock to what the tier can feed"}));
  }
  if(source==="liquid"||source==="fuel"){
    body.append(field(source==="fuel"?"fuel":"source liquid", combo(def.sourceItemId||"", itemOptions(sourceItems), v=>saveEntity("machineDef",withField(def,"sourceItemId",v)), sourceItems.length?"consumed for energy…":"no matching items")));
    body.append(field("converter", checkbox(isConverter, setConverter, "generates an output from its source")));
    function setConverter(on){
      let d={...def};
      if(on){ d=withoutField(d,"baseEnergyConsumption"); d=withField(d,"maxFluidRate",256); d=withField(d,"outputItemId",(outputItems[0]&&outputItems[0].id)||""); }
      else { ["maxFluidRate","outputItemId","efficiency","inputItemId","materialRatio"].forEach(k=>d=withoutField(d,k)); d=withField(d,"baseEnergyConsumption",20); }
      saveEntity("machineDef",d);
    }
    if(isConverter){
      body.append(field("material in", combo(def.inputItemId||"", [{value:"",label:"— none —"}].concat(itemOptions(items)), v=>saveEntity("machineDef", v?withField(def,"inputItemId",v):withoutField(def,"inputItemId")), "pick a material…"), "consumed and turned into the output; leave unset if the source itself is spent"));
      if(def.inputItemId) body.append(optionalNumber("output per material", def.materialRatio, {
        onSet:v=>saveEntity("machineDef",withField(def,"materialRatio",v)),
        onClear:()=>saveEntity("machineDef",withoutField(def,"materialRatio")),
        fallback:1,gt:0,hint:"output units per unit of material; unset = 1:1"}));
      body.append(field("produces", combo(def.outputItemId||"", itemOptions(outputItems), v=>saveEntity("machineDef",withField(def,"outputItemId",v)), outputItems.length?"pick output…":"no liquid/energy items")));
      body.append(optionalNumber("output rate", def.maxFluidRate!=null?toPerTick(def.maxFluidRate):null, {
        onSet:v=>saveEntity("machineDef",withField(def,"maxFluidRate",toPerSecond(v))),
        onClear:()=>saveEntity("machineDef",withoutField(def,"maxFluidRate")),
        fallback:8,min:0,unit:outputUnit,hint:"how much output it makes per tick"}));

function allowedRecipesEditor(def){
  const recipes=WORLD.recipes||[];
  const allowed=def.allowedRecipeIds||[];
  const allowedSet=new Set(allowed);
  const f=el("div",{class:"field","data-fk":"allowed"});
  f.append(el("span",{class:"field-label mono"}, "allowed recipes"+(allowed.length?` (${allowed.length})`:"")));
  if(!recipes.length){ f.append(el("span",{class:"stack-empty mono"},"no recipes")); return f; }
  const set=ids=>saveEntity("machineDef", ids.length?withField(def,"allowedRecipeIds",ids):withoutField(def,"allowedRecipeIds"));
  const drop=rm=>{ const r=new Set(rm); set(allowed.filter(x=>!r.has(x))); };
  const types=recipesByMachineType();
  // A def allowed hundreds of recipes is almost always "every recipe of a type or
  // two": summarise by machine type (each removable as a block) above the list.
  if(allowed.length>CHIPSET_FOLD){
    const byType=new Map();
    for(const id of allowed){ const t=(BY.recipes[id]&&BY.recipes[id].machineType)||""; if(!byType.has(t)) byType.set(t,[]); byType.get(t).push(id); }
    f.append(el("div",{class:"chip-list"}, [...byType].sort((a,b)=>b[1].length-a[1].length).map(([t,ids])=>
      el("span",{class:"chip mono type-chip",title:t?`recipes of machine type “${t}”`:"recipes with no machine type"},
        el("span",null,t||"(no type)"), el("span",{class:"n"},"×"+ids.length),
        el("button",{class:"chip-x",title:"remove all of these",onclick:()=>drop(ids)},"×")))));
  }
  f.append(chipSet({key:"allowed:"+def.id, ids:allowed, noun:"recipes",
    nameOf:id=>(BY.recipes[id]&&BY.recipes[id].name)||id,
    onRemove:id=>drop([id]), onRemoveMany:drop}));
  const addable=recipes.filter(r=>!allowedSet.has(r.id)).map(r=>({value:r.id,label:r.name||r.id,hint:r.machineType||undefined}));
  if(addable.length) f.append(combo("", addable, id=>{ if(id&&!allowedSet.has(id)) set([...allowed,id]); }, "+ allow a recipe…",{clearOnPick:true}));
  const typeOpts=[...types].map(([t,ids])=>{
    const add=ids.filter(id=>!allowedSet.has(id)).length;
    return add? {value:t,label:t,hint:add===ids.length? ids.length+" recipes" : `+${add} of ${ids.length}`} : null;
  }).filter(Boolean);
  if(typeOpts.length) f.append(combo("", typeOpts, t=>{ const ids=types.get(t)||[]; set([...allowed, ...ids.filter(id=>!allowedSet.has(id))]); }, "+ allow a whole machine type…",{clearOnPick:true}));
  f.append(el("span",{class:"field-hint"},"empty = every recipe allowed · a recipe's type is its “machine type” field"));
  return f;
}
// machineType → recipe ids, sorted by type name.
function recipesByMachineType(){

  return new Map([...m].sort((a,b)=>cmp(a[0],b[0])));
}

/* ---- Node ---- */
function nodeInspector(body, n){

  // (boiler / turbine / generator) and a storage buffer bind no recipe; they'd
  // otherwise fall back to *every* recipe in the world (all machine types), which
  // is both wrong and noise. The finder's pool is the machine's own recipes
  // (its allowedRecipeIds), so a macerator never lists a mixer's recipes.
  const isConverter = def && (def.outputItemId!=null || def.maxFluidRate!=null);

  }

  if(n.maxPower){
    body.append(field("overclock",
      el("span",{class:"static-val dim mono"}, "max — tier ceiling"),

      fallback:1,min:def&&def.overclockMin!=null?def.overclockMin:undefined,max:def&&def.overclockMax!=null?def.overclockMax:undefined,
      gt:def&&def.overclockMin!=null?undefined:0,step:0.25,hint:"default 1"}));

  const pf=el("div",{class:"field"});

  pf.append(el("span",{class:"field-hint"},"electric machines ramp to their tier's maximum draw. On, the node ignores its overclock and runs each recipe at the EU/t its tier can feed (maxEuPerTick ÷ the recipe's EU/t). No effect on a def without a power ceiling."));
  body.append(pf);
  body.append(optionalNumber("parallel count", n.count, {
    onSet:v=>saveEntity("node",withField(n,"count",v)),
    onClear:()=>saveEntity("node",withoutField(n,"count")),
    fallback:1,min:1,integer:true,step:1,hint:"default 1"}));

  const bf=el("div",{class:"field"});

function resourceName(id){
  const it=BY.items[id];
  if(it) return (it.isTag?"# ":"")+(it.name||it.id);
  const seg=id.includes(":")?id.split(":")[1]:id; return "# "+seg;
}
function resourceDot(id){ const it=BY.items[id]; return it?(it.isTag?"var(--ink-faint)":catColor(it.category)):"var(--ink-faint)"; }
function stackRes(s){ return s.itemId!=null?s.itemId:(s.tag!=null?s.tag:null); }
function recipeFinder(n, pool){
  // A node may run several recipes at once; its I/O and energy are the sum. The
  // bound recipes are listed (each removable), with a finder to add more.
  const ids = nodeRecipeIds(n);
  const f=el("div",{class:"field","data-fk":"recipe"});
  f.append(el("span",{class:"field-label mono"}, ids.length>1?"recipes":"recipe"));
  // The finder's state (open, filters) outlives the re-render a pick causes, so
  // binding several recipes doesn't mean reopening and re-filtering after each.
  let state=FINDER_STATE.get(n.id);
  if(!state){ state={adding: ids.length===0, input:"", output:""}; FINDER_STATE.set(n.id, state); }
  if(!ids.length) state.adding=true;
  function paint(){
    [...f.querySelectorAll(".recipe-dyn")].forEach(x=>x.remove());
    const dyn=el("div",{class:"recipe-dyn"});
    ids.forEach(rid=>{
      const r=BY.recipes[rid];
      const row=el("div",{class:"recipe-bound",style:{marginBottom:"6px"}});
      row.append(r?recipeSummary(r):el("span",{class:"stack-empty mono"},rid+" (missing)"));
      row.append(el("button",{class:"row-del",style:{marginTop:"4px"},
        onclick:()=>saveEntity("node", setNodeRecipes(n, ids.filter(x=>x!==rid)))},"× remove"));
      dyn.append(row);
    });
    if(state.adding){
      if(!pool.length) dyn.append(el("span",{class:"stack-empty mono"},"no recipes available for this machine"));
      else dyn.append(finderBody(n, pool, ids, rid=>{
        if(!ids.includes(rid)) saveEntity("node", setNodeRecipes(n, ids.concat([rid])));
      }, state));
      if(ids.length) dyn.append(el("button",{class:"clear-btn",style:{marginTop:"6px"},onclick:()=>{state.adding=false;paint();}},"done"));
    } else {
      dyn.append(el("button",{class:"clear-btn",onclick:()=>{state.adding=true;paint();}},"+ add recipe"));
    }
    f.append(dyn);
  }
  paint();
  return f;
}
function recipeSummary(r){
  const chips=stacks=>{
    const rows=stacks||[];
    if(!rows.length) return el("span",{class:"stack-empty mono"},"none");
    return rows.map(s=>{ const id=stackRes(s); if(!id) return null;
      return el("span",{class:"recipe-chip mono"}, el("span",{class:"dot",style:{width:"7px",height:"7px",borderRadius:"50%",background:resourceDot(id)}}),
        s.quantity+"× "+resourceName(id), s.probability!=null?el("span",{style:{color:"var(--ink-faint)"}}," @"+s.probability):null); });
  };
  return el("div",{class:"recipe-summary"},
    r.name?el("div",{class:"mono",style:{color:"var(--ink-dim)",marginBottom:"3px"}},r.name):null,
    el("div",{class:"recipe-io"}, el("span",{class:"recipe-io-label mono"},"in"), el("div",{class:"recipe-chips"}, chips(r.inputs))),
    el("div",{class:"recipe-io"}, el("span",{class:"recipe-io-label mono"},"out"), el("div",{class:"recipe-chips"}, chips(r.outputs))));
}
const FINDER_STATE = new Map();   // nodeId → {adding, input, output}
function finderBody(n, pool, boundIds, onPick, state){
  boundIds = boundIds || [];
  onPick = onPick || (r=>{});
  const wrap=el("div");
  state = state || {input:"",output:""};
  function resourceOptions(side){
    const ids=new Set();
    for(const r of pool) for(const s of (r[side]||[])){ const id=stackRes(s); if(!id) continue; ids.add(id); (BY.items[id]?.members||[]).forEach(m=>ids.add(m)); }
    return [...ids].map(id=>({value:id,label:resourceName(id),dot:resourceDot(id)})).sort((a,b)=>cmp(a.label,b.label));
  }
  function satisfies(recId, chosen){ if(recId===chosen) return true; const m=BY.items[recId]?.members; return m?m.includes(chosen):false; }
  function matches(){
    return pool.filter(r=>{
      if(boundIds.includes(r.id)) return false;  // already bound — hide
      const okIn = !state.input || (r.inputs||[]).some(s=>{ const id=stackRes(s); return id&&satisfies(id,state.input); });
      const okOut= !state.output || (r.outputs||[]).some(s=>{ const id=stackRes(s); return id&&satisfies(id,state.output); });
      return okIn&&okOut;
    });
  }
  function repaint(){
    [...wrap.querySelectorAll(".finder-dyn")].forEach(x=>x.remove());
    const dyn=el("div",{class:"finder-dyn"});
    const list=matches();
    const lst=el("div",{class:"recipe-list","data-sk":"recipe-list"});
    if(!list.length) lst.append(el("div",{class:"combo-empty"},"no matching recipe"));
    list.slice(0,60).forEach(r=>{
      lst.append(el("div",{class:"recipe-opt",onclick:()=>onPick(r.id)}, recipeOneLine(r)));
    });
    dyn.append(lst);
    wrap.append(dyn);
  }
  wrap.append(field("filter by input", combo(state.input||"", [{value:"",label:"— any —"}].concat(resourceOptions("inputs")), v=>{ state.input=v; repaint(); }, "any input…")));
  wrap.append(field("filter by output", combo(state.output||"", [{value:"",label:"— any —"}].concat(resourceOptions("outputs")), v=>{ state.output=v; repaint(); }, "any output…")));
  wrap.append(el("span",{class:"field-hint"},"pick an input and/or output; add several to run them in one block"));
  repaint();
  return wrap;
}
function recipeOneLine(r){
  const side=stacks=>(stacks||[]).map(s=>{const id=stackRes(s); return id?(s.quantity+"× "+resourceName(id)):null;}).filter(Boolean).join(", ")||"—";
  return el("span",{class:"mono"}, (r.name?r.name+" · ":"")+side(r.inputs)+" → "+side(r.outputs));
}

/* ============================================================================
   Create entities, MI import, project dialog, toast
   ============================================================================ */
function createEntity(kind){
  const name = kind==="item"?"New item":kind==="recipe"?"New recipe":"New machine";
  let id;
  // Show the new entry: open its library section, clear a search that would hide
  // it, select it, and put the caret in its name so typing names it.
  const sec={item:"items",recipe:"recipes",machineDef:"machineDefs"}[kind];
  if(sec) railOpen[sec]=true;
  if(railQuery && !railMatch(name,slugify(name))) railQuery="";
  applyEdits(()=>{
    id=idFromName(kind,name);
    return [upsert(kind, kind==="item"?{id,name,category:"solid"} : kind==="recipe"?{id,name,timeSeconds:1} : {id,name})];
  }).then(()=>{
    if(!id) return;
    FOCUS_NEXT='[data-fk="name"] input';
    select(kind,id);
    const leafEl=[...document.querySelectorAll("#railSections .leaf.selected")][0];
    if(leafEl && leafEl.scrollIntoView) leafEl.scrollIntoView({block:"nearest"});
  });
}

/* Centre the canvas on a node / system / junction picked from the library list
   when it is off screen (a click on a visible one leaves the view alone). */
function revealOnCanvas(kind, id){
  const pos = kind==="node"? BY.nodes[id] : kind==="system"? BY.systems[id] : kind==="pipeNode"? BY.junctions[id] : null;
  if(!pos || !$("#canvas")) return;
  const cs=collapseState();
  let target = pos;
  if(kind==="node" && cs.hidden.has(id)){ const sid=cs.proxyForNode.get(id); target=BY.systems[sid]||pos; }
  if(target.x==null||target.y==null) return;
  const domSel = kind==="node"&&!cs.hidden.has(id)? `.node[data-id="${cssEsc(id)}"]` : kind==="pipeNode"? `.junction[data-junction="${cssEsc(id)}"]` : null;
  const dom = domSel? $(domSel) : null;
  const vb=viewportBox();
  if(dom){
    const r=dom.getBoundingClientRect(), c=$("#canvas").getBoundingClientRect();
    if(r.left>=c.left && r.right<=c.right && r.top>=c.top && r.bottom<=c.bottom) return;
  }
  const w = kind==="pipeNode"? 0 : NODE_W, h = kind==="pipeNode"? 0 : 120;
  view.x = vb.cx - (target.x + w/2)*view.k;
  view.y = vb.cy - (target.y + h/2)*view.k;
  applyView();
}

function miImportSection(){
  const sec=el("div",{class:"rail-section","data-fk":"import"});
  const open={get v(){ return IMPORT_UI.open; }, set v(x){ IMPORT_UI.open=x; }};
  const head=el("div",{class:"rail-section-head"},
    el("p",{class:"eyebrow quiet",style:{margin:0}},"Import recipes"),
    el("button",{class:"rail-add",title:"Import machine/item/recipe data from files or folders",onclick:()=>{ open.v=!open.v; render(); }},"+"));
  sec.append(head);
  const bodyHost=el("div"); sec.append(bodyHost);
  function render(){
    bodyHost.textContent="";
    if(!open.v) return;
    // One path per line: an extracted jar directory, a recipe folder, or any set
    // of individual MI-format recipe JSON files (from any mod with the same
    // structure). The backend gathers every machine recipe among them.
    const inp=el("textarea",{class:"field-input mono",rows:"3",spellcheck:"false",
      placeholder:"one path per line —\nextracted jar dir, recipe folder,\nor individual recipe .json files",
      oninput:e=>{ IMPORT_UI.text=e.target.value; }});
    inp.value=IMPORT_UI.text; inp.defaultValue=IMPORT_UI.text;
    const msg=el("span",{class:"mi-msg"+(IMPORT_UI.bad?" bad":"")}, IMPORT_UI.msg);
    const btn=el("button",{class:"tool-btn",disabled:IMPORT_UI.busy,onclick:run}, IMPORT_UI.busy?"Importing…":"Import");
    const setMsg=(t,bad)=>{ IMPORT_UI.msg=t; IMPORT_UI.bad=!!bad; const m=$("#rail .mi-msg"); if(m){ m.textContent=t; m.className="mi-msg"+(bad?" bad":""); } };
    async function run(){
      const paths=IMPORT_UI.text.split("\n").map(s=>s.trim()).filter(Boolean);
      if(!paths.length){ setMsg("enter at least one path", true); return; }
      IMPORT_UI.busy=true; btn.disabled=true; btn.textContent="Importing…"; setMsg("");
      await enqueue(async()=>{
        try{
          const before=structuredClone(WORLD);
          const res=await callApi("import_recipe_files", paths, {});
          HISTORY.push(before); if(HISTORY.length>100) HISTORY.shift();
          WORLD=res.world;
          const st=res.stats||{};
          setMsg(`Imported ${st.recipesImported||0} recipes · ${st.items||0} items · ${st.machineDefs||0} machines`);
          // Import is a deliberate, catalog-sized change: it's already persisted by
          // the backend, so clear the dirty flag and run the sim once.
          DIRTY=false; IMPORT_UI.busy=false; renderAll(); await recompute();
        }catch(err){ setMsg(err.message, true); }
        finally{ IMPORT_UI.busy=false; const b=$("#rail .mi-body .tool-btn"); if(b){ b.disabled=false; b.textContent="Import"; } }
      });
    }
    bodyHost.append(el("div",{class:"mi-body"}, inp, btn, msg,
      el("span",{class:"field-hint"},"paths are on the machine running the backend. folders are scanned recursively; the imported catalog is saved into the project (no re-import needed).")));
  }
  render();
  return sec;
}

function openProjectDialog(){
  if($("#projectDialog")) return;
  const close=()=>{ overlay.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey=e=>{ if(e.key==="Escape"){ e.stopPropagation(); e.preventDefault(); close(); } };
  document.addEventListener("keydown", onKey, true);
  const overlay=el("div",{id:"projectDialog",style:{position:"fixed",inset:0,zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.5)"},
    onclick:e=>{ if(e.target===overlay) close(); }});
  const box=el("div",{style:{width:"min(420px, calc(100vw - 32px))",background:"var(--panel)",border:"1px solid var(--line-2)",borderRadius:"12px",padding:"18px"}});
  box.append(el("p",{class:"eyebrow"},"Project"));
  const inp=el("input",{class:"field-input mono",type:"text",placeholder:"path/to/project.psim.json",style:{marginTop:"8px"},spellcheck:"false",autocomplete:"off",
    value:PROJECT_PATH||""});
  box.append(inp);
  const msg=el("span",{class:"mi-msg",style:{display:"block",marginTop:"8px"}});
  const say=(t,bad)=>{ msg.className="mi-msg"+(bad?" bad":""); msg.textContent=t; };
  const path=()=>{ const p=inp.value.trim(); if(!p){ say("enter a project path", true); flagInvalid(inp); inp.focus(); } return p; };
  const row=el("div",{style:{display:"flex",gap:"8px",marginTop:"12px"}});
  row.append(el("button",{class:"tool-btn",onclick:()=>{
    const p=path(); if(!p) return;
    enqueue(async()=>{
      try{
        WORLD=await callApi("load_project",p); PROJECT_PATH=p;
        HISTORY.length=0; updateUndo(); SEL=null; FINDER_STATE.clear(); DIRTY=false;
        renderAll(); close(); fit(); await recompute();
      }catch(err){ say(err.message, true); }
    });
  }},"Load"));
  row.append(el("button",{class:"tool-btn",onclick:async()=>{
    const p=path(); if(!p) return;
    commitActiveField();
    try{ await editsSettled(); await callApi("save_project",p); PROJECT_PATH=p; say("saved "+p); }
    catch(err){ say(err.message, true); }
  }},"Save"));
  row.append(el("button",{class:"tool-btn",style:{marginLeft:"auto"},onclick:close},"Close"));
  box.append(row,msg);
  box.append(el("span",{class:"field-hint",style:{marginTop:"8px"}},"paths are on the machine running the backend; the working world also autosaves"));
  overlay.append(box); document.body.append(overlay); inp.focus(); inp.select();
}
let PROJECT_PATH="";

let toastT=null;
function toast(text, bad){
  let t=$("#toast"); if(!t){ t=el("div",{class:"toast",id:"toast"}); document.body.append(t); }
  t.className="toast"+(bad?" bad":""); t.textContent=text;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), 3200);
}

/* ============================================================================
   Boot
   ============================================================================ */
// Boot exactly once, from the right source. Three cases:
//  - backend (desktop bridge or HTTP server): load the World the backend restored
//    from the autosave + saved libraries;
//  - standalone export: the World is baked into #world-data;
//  - desktop app before its bridge exists: WAIT. The page is file:// and the
//    `load` event fires before pywebview injects `window.pywebview.api` (WebView2
//    injects it after navigation completes). Booting here used to take the
//    standalone branch with an empty placeholder — the app opened blank although the
//    backend had restored everything, and BOOTED then blocked the real boot on
//    pywebviewready. So with neither a bridge nor baked data, do nothing and let
//    pywebviewready (or the poll below) boot once the bridge is up.
let BOOTED=false, BOOTING=false;
function bakedWorld(){
  const txt=($("#world-data").textContent||"").trim();
  return (txt && !txt.startsWith("<!--"))? txt : null;
}
async function boot(){
  if(BOOTED || BOOTING) return;
  const baked = hasBackend()? null : bakedWorld();
  if(!hasBackend() && baked==null) return;  // desktop bridge not injected yet
  BOOTING=true;
  try{
    WORLD = baked!=null? JSON.parse(baked) : await callApi("get_world");
    BOOTED=true;
  }catch(err){
    const b=$("#bootmsg"); if(b) b.innerHTML='<p class="eyebrow">Bridge</p><div class="mono" style="color:var(--s-bad)">'+(err.message||err)+'</div>';
    return;
  }finally{
    BOOTING=false;
  }
  if(!WORLD || typeof WORLD!=="object") WORLD={};
  for(const k of ["items","recipes","machineDefs","nodes","pipes","pipeNodes","systems"]) if(!WORLD[k]) WORLD[k]=[];
  reindex();
  renderAll();
  fit();
  await recompute();
  window.addEventListener("resize", ()=>applyView());
}


window.addEventListener("pywebviewready", boot);
window.addEventListener("load", boot);
boot();
// Belt and braces for the desktop app: if pywebviewready is missed (it can fire
// between checks on some pywebview/WebView2 versions), poll for the bridge.
(function waitForBridge(started){
  if(BOOTED) return;
  if(bridgeReady()) { boot(); }
  if(Date.now()-started > 30000){
    if(!BOOTED && !hasBackend() && bakedWorld()==null){
      const b=$("#bootmsg"); if(b) b.innerHTML='<p class="eyebrow">Bridge</p><div class="mono" style="color:var(--s-bad)">The desktop bridge never connected. Restart the app.</div>';
    }
    return;
  }
  setTimeout(()=>waitForBridge(started), 100);
})(Date.now());
</script>
