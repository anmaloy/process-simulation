/* ---- Node ---- */
function nodeInspector(body, n){
  const def=BY.defs[n.machineDefId];
  body.append(field("id", el("span",{class:"static-val mono"},n.id)));
  body.append(field("machine def", el("span",{class:"static-val mono"}, (def&&def.name)||n.machineDefId)));

  // Recipe finder — only for machines that actually run a recipe. A converter
  // (boiler / turbine / generator) and a storage buffer bind no recipe; they'd
  // otherwise fall back to *every* recipe in the world (all machine types), which
  // is both wrong and noise. The finder's pool is the machine's own recipes
  // (its allowedRecipeIds), so a macerator never lists a mixer's recipes.
  const isConverter = def && (def.outputItemId!=null || def.maxFluidRate!=null);
  const isStorage = def && def.storage!=null;
  if(isConverter || isStorage){
    body.append(field("recipe", el("span",{class:"static-val dim mono"},
      isStorage? "storage buffer — runs no recipe" : "converter — generates its output automatically, no recipe")));
  } else {
    const pool = (def&&def.allowedRecipeIds&&def.allowedRecipeIds.length)
      ? (WORLD.recipes||[]).filter(r=>def.allowedRecipeIds.includes(r.id))
      : (WORLD.recipes||[]);
    body.append(recipeFinder(n, pool));
  }

  body.append(optionalNumber("overclock", n.overclock, {
    onSet:v=>saveEntity("node",withField(n,"overclock",v)),
    onClear:()=>saveEntity("node",withoutField(n,"overclock")),
    fallback:1,min:def&&def.overclockMin,max:def&&def.overclockMax,step:0.25,hint:"default 1"}));
  body.append(optionalNumber("parallel count", n.count, {
    onSet:v=>saveEntity("node",withField(n,"count",Math.round(v))),
    onClear:()=>saveEntity("node",withoutField(n,"count")),
    fallback:1,min:1,step:1,hint:"default 1"}));

  const bf=el("div",{class:"field"});
  bf.append(el("span",{class:"field-label mono"},"boundary"));
  bf.append(checkbox(!!n.assumeInputs, v=>saveEntity("node", v?withField(n,"assumeInputs",true):withoutField(n,"assumeInputs")), "manual insertion — assume inputs available"));
  bf.append(checkbox(!!n.assumeOutputs, v=>saveEntity("node", v?withField(n,"assumeOutputs",true):withoutField(n,"assumeOutputs")), "manual extraction — assume outputs removed"));
  bf.append(el("span",{class:"field-hint"},"a machine runs only when its inputs are supplied and its outputs are taken; a boundary machine is fed or emptied by hand"));
  body.append(bf);

  body.append(dangerButton("Delete machine node", ()=>deleteSelected()));
}
function resourceName(id){
  const it=BY.items[id];
  if(it) return (it.isTag?"# ":"")+(it.name||it.id);
  const seg=id.includes(":")?id.split(":")[1]:id; return "# "+seg;
}
function resourceDot(id){ const it=BY.items[id]; return it?(it.isTag?"var(--ink-faint)":catColor(it.category)):"var(--ink-faint)"; }
function stackRes(s){ return s.itemId!=null?s.itemId:(s.tag!=null?s.tag:null); }
function recipeFinder(n, pool){
  const bound = n.recipeId? BY.recipes[n.recipeId] : null;
  const f=el("div",{class:"field"});
  const lab=el("span",{class:"field-label mono"},"recipe");
  f.append(lab);
  const state={changing:false};
  function paint(){
    [...f.querySelectorAll(".recipe-dyn")].forEach(x=>x.remove());
    const dyn=el("div",{class:"recipe-dyn"});
    if(bound && !state.changing){
      lab.querySelector(".clear-btn")||lab.append(el("button",{class:"clear-btn",onclick:()=>{ state.changing=true; paint(); }},"change"));
      dyn.append(recipeSummary(bound));
    } else if(!pool.length){
      dyn.append(el("span",{class:"stack-empty mono"},"no recipes available for this machine"));
    } else {
      dyn.append(finderBody(n,pool));
    }
    if(n.recipeId!=null) dyn.append(el("button",{class:"row-del",style:{marginTop:"6px"},onclick:()=>saveEntity("node",withoutField(n,"recipeId"))},"× unset recipe"));
    f.append(dyn);
  }
  paint();
  return f;
}
function recipeSummary(r){
  const chips=stacks=>{
    const rows=stacks||[];
    if(!rows.length) return el("span",{class:"stack-empty mono"},"none");
    return rows.map(s=>{ const id=stackRes(s); if(!id) return null;
      return el("span",{class:"recipe-chip mono"}, el("span",{class:"dot",style:{width:"7px",height:"7px",borderRadius:"50%",background:resourceDot(id)}}),
        s.quantity+"× "+resourceName(id), s.probability!=null?el("span",{style:{color:"var(--ink-faint)"}}," @"+s.probability):null); });
  };
  return el("div",{class:"recipe-summary"},
    r.name?el("div",{class:"mono",style:{color:"var(--ink-dim)",marginBottom:"3px"}},r.name):null,
    el("div",{class:"recipe-io"}, el("span",{class:"recipe-io-label mono"},"in"), el("div",{class:"recipe-chips"}, chips(r.inputs))),
    el("div",{class:"recipe-io"}, el("span",{class:"recipe-io-label mono"},"out"), el("div",{class:"recipe-chips"}, chips(r.outputs))));
}
function finderBody(n, pool){
  const wrap=el("div");
  const state={input:"",output:""};
  function resourceOptions(side){
    const ids=new Set();
    for(const r of pool) for(const s of (r[side]||[])){ const id=stackRes(s); if(!id) continue; ids.add(id); (BY.items[id]?.members||[]).forEach(m=>ids.add(m)); }
    return [...ids].map(id=>({value:id,label:resourceName(id),dot:resourceDot(id)})).sort((a,b)=>cmp(a.label,b.label));
  }
  function satisfies(recId, chosen){ if(recId===chosen) return true; const m=BY.items[recId]?.members; return m?m.includes(chosen):false; }
  function matches(){
    return pool.filter(r=>{
      const okIn = !state.input || (r.inputs||[]).some(s=>{ const id=stackRes(s); return id&&satisfies(id,state.input); });
      const okOut= !state.output || (r.outputs||[]).some(s=>{ const id=stackRes(s); return id&&satisfies(id,state.output); });
      return okIn&&okOut;
    });
  }
  function repaint(){
    [...wrap.querySelectorAll(".finder-dyn")].forEach(x=>x.remove());
    const dyn=el("div",{class:"finder-dyn"});
    const list=matches();
    const lst=el("div",{class:"recipe-list"});
    if(!list.length) lst.append(el("div",{class:"combo-empty"},"no matching recipe"));
    list.slice(0,60).forEach(r=>{
      lst.append(el("div",{class:"recipe-opt",onclick:()=>saveEntity("node", withField(n,"recipeId",r.id))},
        recipeOneLine(r)));
    });
    dyn.append(lst);
    wrap.append(dyn);
  }
  wrap.append(field("filter by input", combo("", [{value:"",label:"— any —"}].concat(resourceOptions("inputs")), v=>{ state.input=v; repaint(); }, "any input…")));
  wrap.append(field("filter by output", combo("", [{value:"",label:"— any —"}].concat(resourceOptions("outputs")), v=>{ state.output=v; repaint(); }, "any output…")));
  wrap.append(el("span",{class:"field-hint"},"pick an input and/or output the machine's recipes use"));
  repaint();
  return wrap;
}
function recipeOneLine(r){
  const side=stacks=>(stacks||[]).map(s=>{const id=stackRes(s); return id?(s.quantity+"× "+resourceName(id)):null;}).filter(Boolean).join(", ")||"—";
  return el("span",{class:"mono"}, (r.name?r.name+" · ":"")+side(r.inputs)+" → "+side(r.outputs));
}

/* ---- Pipe ---- */
const ROLE_OPTS=[{value:"in",label:"in (insert only)"},{value:"out",label:"out (extract only)"},{value:"io",label:"io (both)"}];
const inserts=role=>role==="in"||role==="io", extracts=role=>role==="out"||role==="io";
function pipeInspector(body, p){
  body.append(field("id", el("span",{class:"static-val mono"},p.id)));
  body.append(field("category", el("span",{class:"static-val mono"}, el("span",{class:"legend-dot",style:{background:catColor(p.category),display:"inline-block",marginRight:"6px"}}), p.category)));
  if(p.category==="liquid"){
    body.append(field("transfer rate", el("span",{class:"static-val dim"},"unlimited"), "fluid pipes carry an unlimited rate"));
  } else {
    body.append(field("transfer rate", numberInput(p.movementCapacity, v=>saveEntity("pipe",withField(p,"movementCapacity",v)), {min:0}), "caps sustained flow (× overclock)"));
    body.append(optionalNumber("overclock", p.overclock, {
      onSet:v=>saveEntity("pipe",withField(p,"overclock",v)), onClear:()=>saveEntity("pipe",withoutField(p,"overclock")),
      fallback:1,min:0,step:0.25,hint:"scales movement capacity"}));
  }
  body.append(pipeEnd("end A", p, "a"));
  body.append(pipeEnd("end B", p, "b"));
  body.append(dangerButton("Delete pipe", ()=>deleteSelected()));
}
function pipeEnd(title, p, key){
  const end=p[key];
  const nm=(BY.defs[BY.nodes[end.nodeId]?.machineDefId]?.name)||end.nodeId;
  const box=el("div",{class:"slot-group"});
  box.append(el("div",{class:"field-label mono"}, title+" · ", el("span",{style:{color:"var(--ink-faint)"}},nm)));
  const setEnd=ne=>saveEntity("pipe", withField(p,key,ne));
  box.append(field("role", selectInput(end.role, ROLE_OPTS, role=>{
    let ne=withField(end,"role",role);
    if(!inserts(role)) ne=withoutField(ne,"insertPriority");
    if(!extracts(role)) ne=withoutField(ne,"extractPriority");
    setEnd(ne);
  })));
  if(inserts(end.role)) box.append(optionalNumber("insert priority", end.insertPriority, {
    onSet:v=>setEnd(withField(end,"insertPriority",Math.round(v))), onClear:()=>setEnd(withoutField(end,"insertPriority")),
    min:-128,max:127,step:1,hint:"higher fills first"}));
  if(extracts(end.role)) box.append(optionalNumber("extract priority", end.extractPriority, {
    onSet:v=>setEnd(withField(end,"extractPriority",Math.round(v))), onClear:()=>setEnd(withoutField(end,"extractPriority")),
    min:-128,max:127,step:1,hint:"lower drains first"}));
  return box;
}

/* ---- Pipe junction ---- */
function junctionInspector(body, j){
  const incident=(WORLD.pipes||[]).filter(p=>p.a.nodeId===j.id||p.b.nodeId===j.id);
  body.append(field("id", el("span",{class:"static-val mono"},j.id)));
  // category is editable only while nothing is wired (pipes depend on it)
  if(incident.length===0){
    body.append(field("category", selectInput(j.category,
      ["solid","liquid","energy"].map(c=>({value:c,label:c})),
      v=>saveEntity("pipeNode", withField(j,"category",v))), "the kind of pipe this junction routes"));
  } else {
    body.append(field("category", el("span",{class:"static-val mono"},
      el("span",{class:"legend-dot",style:{background:catColor(j.category),display:"inline-block",marginRight:"6px"}}), j.category),
      "fixed while pipes are attached"));
  }
  body.append(field("connections", el("span",{class:"static-val mono"}, String(incident.length)),
    "a transparent routing point — caps and priorities stay on the pipes"));
  body.append(dangerButton("Delete junction", ()=>deleteSelected()));
}

/* ---- System ---- */
function systemInspector(body, s){
  const nodes=WORLD.nodes||[];
  const members=new Set(s.memberNodeIds||[]);
  const nodeLabel=id=>(BY.defs[BY.nodes[id]?.machineDefId]?.name)||BY.nodes[id]?.machineDefId||id;
  body.append(field("id", el("span",{class:"static-val mono"},s.id)));
  body.append(field("name", textInput(s.name, v=>saveEntity("system", withField(s,"name",v)), "unnamed system")));
  body.append(field("collapsed", checkbox(!!s.collapsed, v=>{
    let next=withField(s,"collapsed",v);
    if(v&&!s.collapsed){ const c=centroidOf([...flattenSystem(s.id).nodeIds]); next.x=c.x; next.y=c.y; }
    saveEntity("system",next);
  }, "fold members into one node")));
  // member nodes
  const mf=el("div",{class:"field"});
  mf.append(el("span",{class:"field-label mono"}, `member nodes (${members.size})`));
  if(members.size) mf.append(el("div",{class:"chip-list"}, [...members].map(id=>
    el("span",{class:"chip mono"}, nodeLabel(id),
      el("button",{class:"chip-x",onclick:()=>saveEntity("system", withField(s,"memberNodeIds",[...members].filter(x=>x!==id)))},"×")))));
  const addable=nodes.filter(nn=>!members.has(nn.id)).map(nn=>({value:nn.id,label:nodeLabel(nn.id)}));
  if(addable.length) mf.append(combo("", addable, id=>saveEntity("system", withField(s,"memberNodeIds",[...members,id])), "+ add member…",{clearOnPick:true}));
  body.append(mf);
  body.append(dangerButton("Delete system (keeps members)", ()=>deleteSelected()));
}

/* ============================================================================
   Create entities, MI import, project dialog, toast
   ============================================================================ */
function createEntity(kind){
  const name = kind==="item"?"New item":kind==="recipe"?"New recipe":"New machine";
  const id=idFromName(kind,name);
  const entity = kind==="item"?{id,name,category:"solid"} : kind==="recipe"?{id,name,timeSeconds:1} : {id,name};
  applyEdits([upsert(kind,entity)]);
  select(kind,id);
}

function miImportSection(){
  const sec=el("div",{class:"rail-section"});
  const open={v:false};
  const head=el("div",{class:"rail-section-head"},
    el("p",{class:"eyebrow quiet",style:{margin:0}},"Import MI"),
    el("button",{class:"rail-add",title:"Import Modern Industrialization recipes",onclick:()=>{ open.v=!open.v; render(); }},"+"));
  sec.append(head);
  const bodyHost=el("div"); sec.append(bodyHost);
  function render(){
    bodyHost.textContent="";
    if(!open.v) return;
    const inp=el("input",{class:"field-input mono",type:"text",placeholder:"path to extracted MI jar dir",spellcheck:"false"});
    const msg=el("span",{class:"mi-msg"});
    const btn=el("button",{class:"tool-btn",onclick:run},"Import recipes");
    async function run(){
      const p=inp.value.trim(); if(!p) return;
      btn.disabled=true; btn.textContent="Importing…"; msg.className="mi-msg"; msg.textContent="";
      try{
        snapshot();
        const res=await callApi("import_mi_dir", p, {});
        WORLD=res.world; reindex();
        const st=res.stats||{};
        msg.className="mi-msg"; msg.textContent=`Imported ${st.recipesImported||0} recipes · ${st.items||0} items · ${st.machineDefs||0} machines`;
        renderAll(); await recompute();
      }catch(err){ msg.className="mi-msg bad"; msg.textContent=err.message; }
      finally{ btn.disabled=false; btn.textContent="Import recipes"; }
    }
    bodyHost.append(el("div",{class:"mi-body"}, inp, btn, msg,
      el("span",{class:"field-hint"},"reads an extracted MI jar directory (Python host only)")));
  }
  return sec;
}

function openProjectDialog(){
  const overlay=el("div",{style:{position:"fixed",inset:0,zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.5)"},
    onclick:e=>{ if(e.target===overlay) overlay.remove(); }});
  const box=el("div",{style:{width:"420px",background:"var(--panel)",border:"1px solid var(--line-2)",borderRadius:"12px",padding:"18px"}});
  box.append(el("p",{class:"eyebrow"},"Project"));
  const inp=el("input",{class:"field-input mono",type:"text",placeholder:"path/to/project.psim.json",style:{marginTop:"8px"}});
  box.append(inp);
  const msg=el("span",{class:"mi-msg",style:{display:"block",marginTop:"8px"}});
  const row=el("div",{style:{display:"flex",gap:"8px",marginTop:"12px"}});
  row.append(el("button",{class:"tool-btn",onclick:async()=>{
    const p=inp.value.trim(); if(!p) return;
    try{ WORLD=await callApi("load_project",p); reindex(); HISTORY.length=0; updateUndo(); SEL=null; renderAll(); await recompute(); fit(); overlay.remove(); }
    catch(err){ msg.className="mi-msg bad"; msg.textContent=err.message; }
  }},"Load"));
  row.append(el("button",{class:"tool-btn",onclick:async()=>{
    const p=inp.value.trim(); if(!p) return;
    try{ await callApi("save_project",p); msg.className="mi-msg"; msg.textContent="saved "+p; }
    catch(err){ msg.className="mi-msg bad"; msg.textContent=err.message; }
  }},"Save"));
  row.append(el("button",{class:"tool-btn",style:{marginLeft:"auto"},onclick:()=>overlay.remove()},"Close"));
  box.append(row,msg);
  box.append(el("span",{class:"field-hint",style:{marginTop:"8px"}},"paths are on the machine running the backend; the working world also autosaves"));
  overlay.append(box); document.body.append(overlay); inp.focus();
}

let toastT=null;
function toast(text, bad){
  let t=$("#toast"); if(!t){ t=el("div",{class:"toast",id:"toast"}); document.body.append(t); }
  t.className="toast"+(bad?" bad":""); t.textContent=text;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), 3200);
}

/* ============================================================================
   Boot
   ============================================================================ */
let BOOTED=false;
async function boot(){
  if(BOOTED) return;
  try{
    if(hasBackend()){
      WORLD = await callApi("get_world");
      BOOTED=true;
    } else {
      const txt=($("#world-data").textContent||"").trim();
      WORLD = (txt && !txt.startsWith("<!--"))? JSON.parse(txt) : {};
      BOOTED=true;
    }
  }catch(err){
    if(BOOTED) return;
    const b=$("#bootmsg"); if(b) b.innerHTML='<p class="eyebrow">Bridge</p><div class="mono" style="color:var(--s-bad)">'+(err.message||err)+'</div>';
    return;
  }
  if(!WORLD || typeof WORLD!=="object") WORLD={};
  for(const k of ["items","recipes","machineDefs","nodes","pipes","systems"]) if(!WORLD[k]) WORLD[k]=[];
  reindex();
  renderAll();
  refreshPalette();
  fit();
  await recompute();
  window.addEventListener("resize", ()=>applyView());
}

// Hook render to also refresh the palette (defs may have changed).
const _renderAll = renderAll;
renderAll = function(){ _renderAll(); refreshPalette(); };

if(window.pywebview && window.pywebview.api) boot();
window.addEventListener("pywebviewready", boot);
window.addEventListener("load", boot);
</script>
